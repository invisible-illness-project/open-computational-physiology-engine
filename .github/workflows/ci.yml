name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine-and-conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install engine (pulls pyyaml + jsonschema)
        run: |
          python -m pip install --upgrade pip
          pip install -e implementations/python pytest==9.1.1
      - name: engine unit tests
        run: pytest implementations/python/tests/ -q
      - name: specification conformance suite
        run: pytest tests/ -q
      - name: CLI smoke tests
        run: |
          ocpe --version
          ocpe validate
          ocpe resolve REGULATES
          ocpe resolve FR --path conformance/fixtures/packages/valid/aliases
          ocpe units convert 1 /s /min
          ocpe check-observation conformance/fixtures/observations/valid/measured-with-method.yaml --path conformance/fixtures/packages/valid/quantity-observation
          ocpe diff conformance/fixtures/versions/major-equation/old conformance/fixtures/versions/major-equation/new
          ocpe conformance conformance/
      - name: core vocabulary + spec artifacts validate
        run: ocpe validate --strict

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build implementations/python
      - name: install built wheel in a clean environment
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install implementations/python/dist/ocpe-*.whl
          /tmp/wheelenv/bin/ocpe --version
          /tmp/wheelenv/bin/ocpe validate
          /tmp/wheelenv/bin/ocpe conformance conformance/
      - name: install sdist in a clean environment
        run: |
          python -m venv /tmp/sdistenv
          /tmp/sdistenv/bin/pip install implementations/python/dist/ocpe-*.tar.gz
          /tmp/sdistenv/bin/ocpe --version
