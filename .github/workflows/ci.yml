name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine-and-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install engine (pulls pyyaml + jsonschema)
        run: |
          python -m pip install --upgrade pip
          pip install -e implementations/python pytest==9.1.1
      - name: pytest (engine + specification conformance)
        run: pytest tests/ -q
      - name: validate all domain packages
        run: ocpe validate packages/ --strict
      - name: resolver smoke tests
        run: |
          ocpe resolve ocpe:cardiovascular/heart-rate
          ocpe resolve Hc --scope legacy-kb
          ocpe resolve 'ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022#RalpM'
      - name: declared dependency satisfaction
        run: ocpe deps
