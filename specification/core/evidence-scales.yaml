# OCPE evidence scales (specification 0.1.x).
#
# Two grading scales are defined for evidence statements: "evidence_level"
# (Level 1-4) and "evidence_tier" (A-D). Only 'Level 1' (randomized controlled
# trial) and 'Level 4' (in silico / computational) have documented anchors;
# Levels 2-3 and the tier definitions A-D are PROVISIONAL and require
# ratification by the adopting community. Packages may attach evidence without
# either scale (basis/references alone); the scales qualify, never replace, the
# evidential basis.
ocpe_spec: "0.1"

evidence_level:
  status: provisional
  values:
    "Level 1": { definition: "Randomized controlled trial or equivalent highest-grade human evidence.", status: documented }
    "Level 2": { definition: "Human observational/experimental or review evidence (inferred from usage).", status: provisional }
    "Level 3": { definition: "Intermediate grade; rarely used.", status: provisional }
    "Level 4": { definition: "In-silico / computational-modelling evidence.", status: documented }
  caution: >
    A 'Level 1' grade on a definitional identity (e.g. a mathematical
    equivalence) reflects the identity, not an RCT. Consumers should prefer
    evidence.basis ('definitional') over the level in such cases.

evidence_tier:
  status: provisional
  values:
    A: { definition: "Strong human evidence for the stated aspect (typically direction), e.g. multiple or well-powered human studies.", status: provisional }
    B: { definition: "Moderate human evidence (small samples, single studies) for the stated aspect.", status: provisional }
    C: { definition: "Model-derived or scaled value from a cited source; machine-proposed fits.", status: provisional }
    D: { definition: "Unverified / machine-calibrated magnitude without parameter-level citation.", status: provisional }

guidance:
  - "Always state WHICH aspect is supported (evidence.supports): direction-level evidence must not be read as magnitude-level support."
  - "Structural (schema) validation never implies scientific validation."
