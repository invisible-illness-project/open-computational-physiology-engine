id: core
name: OCPE Core Vocabulary
version: "0.1.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Specification-level vocabulary every package may depend on: the relationship
  predicate vocabulary and named functional forms used to qualify relationships.
  Entity kinds (concept, variable, latent_construct, derived_metric,
  measurement_method, model, relationship, predicate, functional_form) are
  defined by the JSON Schemas in specification/schemas/ and described in
  kinds.yaml. OCPE owns this language infrastructure only; physiological domain
  content is authored and versioned in external packages.
contents:
  - predicates.yaml
  - functional-forms.yaml
changelog: ../versions/CHANGELOG.md
