ocpe: "0.1"
package: core
title: Relationship predicate vocabulary
description: >
  Predicates for 'subject PREDICATE object' relationships. The reading direction
  is always subject -> object. This is the core vocabulary every package may use;
  domain packages may define additional predicates for domain-specific links.
entities:
  - id: ocpe:core/causes
    kind: predicate
    token: CAUSES
    label: causes
    definition: "A directly causal link where changes in the subject lead to changes in the object."
    causal: true
    since: "0.1.0"
  - id: ocpe:core/increases
    kind: predicate
    token: INCREASES
    label: increases
    definition: "A positive directional modulation; increasing the subject increases the object."
    causal: true
    since: "0.1.0"
  - id: ocpe:core/decreases
    kind: predicate
    token: DECREASES
    label: decreases
    definition: "A negative directional modulation; increasing the subject decreases the object."
    causal: true
    since: "0.1.0"
  - id: ocpe:core/regulates
    kind: predicate
    token: REGULATES
    label: regulates
    definition: "An active feedback-control relationship between subject and object."
    causal: true
    since: "0.1.0"
  - id: ocpe:core/derived-from
    kind: predicate
    token: DERIVED_FROM
    label: derived from
    definition: "A mathematical or direct physical derivation of the object from the subject."
    causal: false
    since: "0.1.0"
  - id: ocpe:core/measured-by
    kind: predicate
    token: MEASURED_BY
    label: measured by
    definition: "An association where the subject quantity is directly measured by the object method."
    object_kinds: [measurement_method]
    causal: false
    since: "0.1.0"
  - id: ocpe:core/estimated-by
    kind: predicate
    token: ESTIMATED_BY
    label: estimated by
    definition: "An association where the subject quantity is estimated via the object method or model."
    object_kinds: [measurement_method, model]
    causal: false
    since: "0.1.0"
  - id: ocpe:core/validated-by
    kind: predicate
    token: VALIDATED_BY
    label: validated by
    definition: "Links a model, relationship or quantity to a validation dataset or study."
    causal: false
    since: "0.1.0"
  - id: ocpe:core/perturbed-by
    kind: predicate
    token: PERTURBED_BY
    label: perturbed by
    definition: "Indicates that an external factor, state or intervention alters the subject."
    causal: true
    since: "0.1.0"
  - id: ocpe:core/modulated-by
    kind: predicate
    token: MODULATED_BY
    label: modulated by
    definition: "Indicates that a behaviour, rhythm or state modulates the subject."
    causal: true
    since: "0.1.0"
  - id: ocpe:core/part-of
    kind: predicate
    token: PART_OF
    label: part of
    definition: "A structural or organizational containment link."
    causal: false
    transitive: true
    since: "0.1.0"
  - id: ocpe:core/associated-with
    kind: predicate
    token: ASSOCIATED_WITH
    label: associated with
    definition: "A statistical correlation or association without direct causal proof."
    causal: false
    since: "0.1.0"
