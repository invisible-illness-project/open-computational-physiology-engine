ocpe: "0.1"
package: core
title: Functional forms
description: >
  Named shapes of dependencies used to qualify relationships. The core
  intentionally contains only genuinely generic mathematical primitives;
  domain-specific functional forms (sigmoids, hydrostatic relations,
  kinetics, ...) are functional_form entities defined by external domain
  packages. Expressions here are generic mathematical templates;
  model-specific equations live in model specifications.
entities:
  - id: ocpe:core/first-order-lag
    kind: functional_form
    token: first_order_lag
    label: First-order lag
    definition: "State relaxes towards a target with time constant tau: dx/dt = (target - x)/tau."
    expression_latex: '\frac{dx}{dt} = \frac{x_{target} - x}{\tau}'
    parameters: [tau]
    monotonicity: depends_on_parameters
    since: "0.1.0"
  - id: ocpe:core/linear
    kind: functional_form
    token: linear
    label: Linear
    definition: "y = a x + b."
    expression_latex: 'y = a x + b'
    parameters: [a, b]
    monotonicity: depends_on_parameters
    since: "0.1.0"
  - id: ocpe:core/qualitative
    kind: functional_form
    token: qualitative
    label: Qualitative (direction only)
    definition: "Only the existence and/or direction of the dependency is asserted; no functional form is implied."
    monotonicity: depends_on_parameters
    since: "0.1.0"
