# Authorization policy: Invisible Illness Project (IIP) — OPTIONAL governance extension.
#
# This file documents, as data, the downstream-use policy that was hard-coded in
# the pre-0.1 validation/sidecar_manifest.py::check_authorization. It is an
# ORGANISATION-SPECIFIC policy, not part of the OCPE core specification. Other
# adopters may supply their own policy file with the same structure. Loading,
# validating and resolving OCPE content never consults this policy.
policy_id: iip-default
version: "1.0.0"
source: "validation/sidecar_manifest.py (pre-architectural-refactor), check_authorization()"
global_rules:
  - when: "derived state is STALE"
    decision: PROHIBITED
  - when: "deterministic validation FAILED"
    decision: PROHIBITED
  - when: "any OPEN/UNRESOLVED CRITICAL challenge"
    decision: PROHIBITED
uses:
  exploratory_research:
    ALLOWED: [DETERMINISTICALLY_VALID, AGENT_REVIEWED, AGENT_SUPPORTED, COMPUTATIONALLY_REPRODUCED, HUMAN_REVIEWED, HUMAN_APPROVED]
    otherwise: PROHIBITED
  third_party_research:
    ALLOWED: [HUMAN_APPROVED]
    ALLOWED_WITH_DISCLOSURE: [AGENT_SUPPORTED, COMPUTATIONALLY_REPRODUCED, DETERMINISTICALLY_VALID, AGENT_REVIEWED]
    otherwise: PROHIBITED
  iip_research:
    ALLOWED: [AGENT_SUPPORTED, COMPUTATIONALLY_REPRODUCED, HUMAN_REVIEWED, HUMAN_APPROVED, DETERMINISTICALLY_VALID, AGENT_REVIEWED]
    otherwise: PROHIBITED
  iip_production:
    requires: "explicit human APPROVED review matching current content hash"
    otherwise: REQUIRES_HUMAN_APPROVAL
  clinical:
    decision: PROHIBITED
    reason: "Clinical use is strictly PROHIBITED under current research engine governance."
