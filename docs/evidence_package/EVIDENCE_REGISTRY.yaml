    mechanism: nutrient absorption -> insulin secretion -> peripheral uptake + hepatic glucose output suppression
    direction: rise then decay
    magnitude: "breakfast peak 132.3 +/- 16.7 mg/dL; rise +50.2 +/- 14.5 (breakfast), +38.8 +/- 11.2 (lunch), +42.6 +/- 18.7 (dinner); time-to-peak 46-50 min"
    distribution: "pregnancy cohort time-to-peak median 62 min, IQR 40-124 min (wide)"
    timescale: rise 0-60 min; decay 60-180 min
    trigger: mixed meal
    response: glucose +~40-50 mg/dL peak
    recovery: baseline by 2-3 h
    population: healthy non-diabetic (and uncomplicated pregnancy)
    sample_size: "n=21 (Freckmann); pregnancy n=157"
    wearable_modality: CGM
    observable_signal: CGM glucose excursion
    derived_features: [time-to-peak, excursion amplitude, rise rate ~0.5-1 mg/dL/min]
    evidence_type: controlled CGM meal studies
    evidence_strength: E4
    dossier_evidence_strength: E4
