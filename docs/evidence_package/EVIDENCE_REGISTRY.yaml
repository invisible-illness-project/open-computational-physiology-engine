registry_metadata:
  name: OCPE Evidence Registry (Pass 2)
  generated_by: Evidence Auditor (Pass 2)
  source_dossiers:
    - HEALTHY_PHYSIOLOGY_EVIDENCE.md
    - AUTONOMIC_PHYSIOLOGY_EVIDENCE.md
    - DISEASE_EVIDENCE_POTS.md
    - DISEASE_EVIDENCE_MECFS.md
    - DISEASE_EVIDENCE_LONGCOVID.md
    - DISEASE_EVIDENCE_EDS.md
    - DISEASE_EVIDENCE_AUTOIMMUNE.md
    - METABOLIC_PHYSIOLOGY_EVIDENCE.md
    - NEUROLOGICAL_PHYSIOLOGY_EVIDENCE.md
    - SENSOR_MODEL_EVIDENCE.md
    - POPULATION_MODEL_EVIDENCE.md
    - TEMPORAL_MODEL_EVIDENCE.md
    - WEARABLE_OBSERVABILITY_EVIDENCE.md
  standard_scale: "E0 hypothesis | E1 mechanistic | E2 observational human | E3 controlled human experimental | E4 replicated quantitative | E5 meta-analysis/consensus"
  scale_warning: >
    Dossiers used INCONSISTENT E-scales. HEALTHY, AUTONOMIC, POTS, MECFS, LONGCOVID, EDS,
    AUTOIMMUNE, METABOLIC, NEUROLOGICAL use the standard scale above. TEMPORAL_MODEL uses an
    INVERTED scale (E0 = established consensus ... E5 = engineering judgment). WEARABLE_OBSERVABILITY
    uses a METROLOGY scale (E0 = established standard ... E4 = speculative/marketing ... E5 = background
    textbook physiology). SENSOR_MODEL and POPULATION_MODEL: see per-claim scale_note.
    For every claim, 'dossier_evidence_strength' is copied verbatim from the dossier and
    'evidence_strength' is the auditor-normalized value on the standard scale (with auditor
    downgrades applied per EVIDENCE_AUDIT_NOTES.md). DOIs/PMIDs copied verbatim from dossiers,
    including dossier-flagged unverified identifiers; verbatim copying does NOT imply verification.
  rating_fields:
    generalizability: low | moderate | high | null
    population_match: low | moderate | high | null   # match to OCPE target populations
    measurement_quality: low | moderate | high | null
    replication: none | low | moderate | high | null
    quantitative_strength: low | moderate | high | null
    contradiction_level: none | low | moderate | high

