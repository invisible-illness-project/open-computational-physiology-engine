  - claim_id: EVD-METB-001
    claim: "Healthy 24-h mean interstitial glucose is ~90-99 mg/dL, higher by day than night; median time-in-range (70-140 mg/dL) 96%."
    condition: healthy
    phenotype: normative glycemia
    physiological_domain: metabolic / glucose homeostasis
    variable: interstitial glucose (24-h mean, diurnal pattern)
    mechanism: insulin/glucagon feedback maintaining narrow euglycemia
    direction: diurnal nadir ~03:00-06:00
    magnitude: "Freckmann: 24-h mean 89.3 +/- 6.2 mg/dL (day 93.0 +/- 7.0, night 81.8 +/- 6.3); Shah: mean 98-99 mg/dL, >60y 104 mg/dL"
    distribution: "TIR median 96% (IQR 93-98); time >140 mg/dL median 2.1%; time <70 mg/dL 1.1%"
    timescale: continuous, diurnal
    trigger: null
    response: null
    recovery: null
    population: healthy non-diabetic adults, age 7-80
    sample_size: "n=21 (Freckmann); n=153 (Shah)"
    wearable_modality: CGM only
    observable_signal: interstitial glucose (CGM); not observable by PPG/EDA/temperature
    derived_features: [mean glucose, time-in-range, time-above/below-range, diurnal nadir]
    evidence_type: two independent normative CGM cohorts
    evidence_strength: E4
    dossier_evidence_strength: E4
    source: "Freckmann et al., J Diabetes Sci Technol 2007;1(5):695-703; Shah et al., J Clin Endocrinol Metab 2019"
    doi: null
    pmid: "31127824 (Shah); Freckmann PMC2769652, unverified PMID"
    supporting_evidence: "pregnancy CGM cohort n=157 fasting 88+/-14 mg/dL (BMJ Open Diab Res Care 2024, e003989)"
    contradictory_evidence: "Hall 2018: ~1/3 of 'healthy' participants show dysregulated glucotypes; 51% spent >=2% time >140 mg/dL (Shah)"
    limitations: "interstitial not blood; small Freckmann n; sensor bias ~-5 to -10 mg/dL in healthy range"
    implementation_recommendation: "simulate 24-h glucose ~ N(90-99, SD 6-8 mg/dL) with diurnal component ~-10 mg/dL at night; persona-level glucotype random effect"
    validation_strategy: "compare synthetic distributions to Shah 2019 percentiles (TIR 96%, CV 17%)"
    generalizability: moderate
    population_match: high
    measurement_quality: high
    replication: moderate
    quantitative_strength: high
    contradiction_level: low

