metadata:
  name: OCPE Parameter Specification (first-dataset scope; Model Translation, Pass 3)
  generated_by: Model Translation Scientist
  scale_note: 'All evidence_level values use the NORMALIZED standard scale from EVIDENCE_REGISTRY.yaml: E0=hypothesis, E1=mechanistic, E2=observational
    human, E3=controlled human experimental, E4=replicated quantitative, E5=meta-analysis/consensus. TEMPORAL_MODEL_EVIDENCE.md and WEARABLE_OBSERVABILITY_EVIDENCE.md
    use INVERTED scales; only registry-normalized values are used here. Auditor downgrades (EVIDENCE_AUDIT_NOTES.md, CONTRADICTION_AUDIT.md, INDEPENDENT_REVIEW_PASS2.md)
    are applied and are BINDING.'
  tier_definitions:
    implementable_now: human-data anchored (E3-E5 after binding downgrades), distribution specified, maps to repo symbol or well-defined NEW symbol
    provisional_with_uncertainty: usable ONLY as distributions/mixtures/latents with explicit uncertainty; on the audit's do-not-hard-code list
      or single-source/contradicted
    requires_further_research: evidence absent, engine-falsified, or speculative; engine-inert or optional-flag only
  binding_resolutions_applied:
  - 'Hypovolemic POTS: repo TotalVol=3500 (Geddes in-silico, ~1.5x Raj 2005 measured 689+/-270 mL deficit) REPLACED by mixture distribution (hypovolemic
    branch ~40-50% weight, deficit ~-14+/-10%; volume-normal branch); 3500 retained only as extreme-tail scenario sample (EVD-POTS-004, contradiction
    Target 3).'
  - Geddes-derived POTS gain perturbations (RalpM->11.5, Ralpm->0.76, kR->32, kH->34, kE->10, p2H->89.8) demoted to tier-D scenario samples; competing
    Fu-2010 branch (small LV mass + hypovolemia + INTACT baroreflex) added as explicit model branch (contradiction Target 2).
  - 'Neuropathic POTS criterion failure documented: repo reaches 21.2 bpm vs >=30 target (flat dose-response, hydrostatic-gate-limited); dV_veno_max
    denervation stays tier-D experimental; do not report as validated.'
  - Hyperadrenergic kR/kH/p2H normal_value-vs-KB-nominal mismatch documented (applied 34.78/31.48/89.96, not 32/34/89.8); delta-SBP +10 mmHg criterion
    unmet (-4.0, 0-D windkessel limitation) - xfail is not a resolution.
  - Repo population.py HM=(220-age)/60 uses SUPERSEDED Fox equation - replace with Tanaka 208-0.7*age + N(0,10.5).
  - Repo time_engine PEM constants (12-h delay / 0.6 threshold / 2-h resolution) replaced by gamma-delay + right-skewed-recovery kernel (mean
    12.7 d, NOT median); PEM currently dead code (exertion never passed).
  - Sensor constants (sigma=1 ms, dropout 0.5%) replaced by KB validation metrics (Polar H10 LoA -2.3/+2.4 ms, ICC 0.99; PPG HR LoA -7.19/+6.64
    bpm; usable-fraction day/night split).
  - PEM symptom kernel decoupled from physiological slowed-recovery kernel (3-6 h healthy vs 9-13 h patient); delayed 24-48 h physiological second
    wave is E0 optional, default OFF.
  - 'Fever-HR slope age-graded: ~13 (young child) -> ~10 (older child) -> 7-10 (adult) bpm/degC; 12.3 pediatric-only value never used for adults.'
  - 'Repo tier-C relabeled: provenance ''machine-fitted'' + strength E0-E1 + mandatory human-range citation; recommended provenance enum {human-experimental,
    human-observational, meta-analysis, in-silico, machine-fitted, engineering-judgment} alongside E0-E5.'
implementable_now:
- parameter: resting_HR_mean
  meaning: 'Free-living daily resting heart rate (definition-conditional: nocturnal-RHR vs daytime-rest vs seated-clinic are different quantities)'
  units: bpm
  distribution:
    type: normal_conditional
    mean: 'mu(age,sex,fitness): Quer 65.5 overall; inverted-U age shape (peak ~50 y); women +3 bpm; fitness -5 to -12; Health eHeart real-world
      on-demand 77.6+/-14.6 healthy (gradients only, not absolute calibration)'
    sd_between: 7.7
    note: sigma_between 7.7 (Fitbit n=92,457) to 12-14 (Health eHeart young); device/definition offsets +/-4-8 bpm
  bounds:
  - 35
  - 120
  population_dependence: age (inverted-U), sex (+3 bpm female), BMI, fitness; sex+age+BMI+sleep explain <=10% of variance - most between-person
    variance unexplained; seasonality +/-1 bpm sinusoid (peak early Jan)
  condition_dependence:
    mecfs: +3-5 bpm severity-scaled (E4; effect below within-person noise floor)
    pots_clinic: +10-20 bpm
    pots_self_report: +~3 bpm near-complete overlap (spectrum-dependent; do-not-hard-code)
    long_covid: +1-3 bpm tail
    heds: +~10 bpm (E4 borderline)
    anxiety: via tonic vagal knob
  temporal_behavior: stable trait + OU day-to-day drift (REL-DAY-TO-DAY-DRIFT)
  equation: RHR ~ N(mu(age,sex,fitness), sigma_between); tag every synthetic record with RHR definition
  source:
  - EVD-POP-001
  - EVD-HLTH-001
  - EVD-MECFS-003
  - EVD-POTS-014
  - EVD-EDS-002
  evidence_level: E2
  confidence: moderate-high (large n; definition dependence documented)
  implementation: NEW (fixes simulation/population.py uncited priors); reconcile with repo cohorts.yaml
  validation: synthetic RHR marginals by age/sex vs Quer 2020; synthetic resting-HR classifier AUC near chance on self-report-like POTS labels
- parameter: resting_HR_within_person_SD
  meaning: Day-to-day within-person RHR variability
  units: bpm
  distribution:
    type: normal
    mean: 3.03
    sd: 0.5
    cv: 0.046
  bounds:
  - 1.5
  - 6
  population_dependence: weak
  condition_dependence:
    mecfs: baseline RHR stable trait with episode-linked deviations (6-month Fitbit stability)
  temporal_behavior: daily OU noise
  equation: RHR_day = RHR_trait + OU(sigma)
  source:
  - EVD-POP-004
  - EVD-POP-001
  - EVD-HLTH-001
  evidence_level: E4
  confidence: high (n=92,457; reconciles HEALTHY E0 gap per review P0.4)
  implementation: NEW (time_engine/behavior layer)
  validation: 5-day ICC 0.87 in synthetic series
- parameter: RMSSD_age_sex_marginal
  meaning: Short-term resting RMSSD population reference (right-skewed)
  units: ms
  distribution:
    type: lognormal_spline
    anchor: Lifelines n=84,772 age-bin medians (women 52.1 ms at 20-24 y -> 17.8 at 65-69); meta-norm 42 ms (19-75); women > men ~5 ms only 20-45
      y
  bounds:
  - 3
  - 200
  population_dependence: steep age decline to ~60 y then plateau; sex gap 20-45 y only
  condition_dependence:
    mecfs: SMD -0.37 (~-10-20% relative; large overlap - NOT drastically low)
    pots: -15.16 ms time-domain reduction (upright)
    anxiety: g -0.3 to -0.45 tonic
  temporal_behavior: chronic trait + lnRMSSD day-to-day CV 3-13% (standardized)
  equation: ln(RMSSD) ~ Normal(mu(age,sex), sigma); mechanistically generated from vagal state + RR scaling (REL-HR-RMSSD-SCALING)
  source:
  - EVD-POP-002
  - EVD-HLTH-002
  - EVD-MECFS-004
  - EVD-POTS-011
  evidence_level: E5
  confidence: high
  implementation: NEW (emergent from HRV generator; repo currently has no RSA/HRV structure)
  validation: synthetic RMSSD age/sex quantiles vs Lifelines tables
- parameter: SDNN_24h
  meaning: 24-h SDNN healthy reference
  units: ms
  distribution:
    type: normal
    mean: 150
    sd: 38
  bounds:
  - 40
  - 300
  population_dependence: age decline; men 160+/-40, women 147+/-36 (25-41 y)
  condition_dependence:
    long_covid: -15-25% group level (E2, cross-sectional)
  temporal_behavior: 24-h aggregate
  equation: emergent from beat generator
  source:
  - EVD-HLTH-002
  - EVD-LCOV-005
  evidence_level: E4
  confidence: high
  implementation: NEW
  validation: Aeschbacher 24-h values; Nunan pooled table
- parameter: HRmax
  meaning: Maximal heart rate
  units: bpm
  distribution:
    type: normal
    mean: 208 - 0.7*age
    sd: 10.5
  bounds:
  - 140
  - 220
  population_dependence: age slope -0.7; women 206-0.88*age (Gulati); fit 211-0.64*age (Nes/HUNT); residual irreducible (LoA ~44 bpm span)
  condition_dependence:
    mecfs: criterion HRmax -5.81+/-3.34 bpm; symptom-limited HRpeak -16.62 (effort-confounded)
    long_covid: CI subgroup -49 bpm (30% of symptomatic clinic)
  temporal_behavior: chronic trait
  equation: HRmax = 208 - 0.7*age + N(0,10.5)
  source:
  - EVD-POP-003
  - EVD-METB-010
  - EVD-HLTH-005
  - EVD-MECFS-005
  evidence_level: E5
  confidence: high
  implementation: 'REPO SYMBOL FIX: simulation/population.py HM=(220-age)/60 uses SUPERSEDED Fox equation - replace with Tanaka; note repo model
    ceiling HM=3.3333 bps (200 bpm) is a model bound, distinct from population HRmax'
  validation: synthetic HRmax residual SD ~10.5 bpm
- parameter: HRR1
  meaning: 1-min heart-rate recovery after maximal exercise with cool-down
  units: bpm
  distribution:
    type: normal
    mean: 20
    sd: 6
  bounds:
  - 2
  - 60
  population_dependence: age -3.6 bpm/20 y (CARDIA); fitness effect CONTRADICTORY - no universal mapping
  condition_dependence:
    long_covid: -7.9 bpm in CI subgroup
    mecfs: no established difference (Nelson 2019 meta, 2 studies)
  temporal_behavior: event recovery
  equation: biexponential off-kinetics (REL-EXERCISE-KINETICS)
  source:
  - EVD-HLTH-005
  - EVD-POP-003
  evidence_level: E5
  confidence: high (protocol-dependent)
  implementation: NEW
  validation: Cole-protocol distribution; abnormal <=12 bpm
- parameter: respiration_rate_rest
  meaning: Resting respiratory rate
  units: breaths/min
  distribution:
    type: normal
    mean: 15.5
    sd: 2.3
    truncate:
    - 9
    - 28
  bounds:
  - 6
  - 35
  population_dependence: U-shaped age (min ~15.2 at 49-58 y); athletes -2 to -3.5 with larger tidal volume
  condition_dependence:
    pots: postural hyperventilation subset ~25% (ETCO2<30)
    sleep: N3 ~13 low CV; REM ~16 high CV
  temporal_behavior: state-dependent; drives RSA gating
  equation: RR ~ N(15.5, 2.3)
  source:
  - EVD-HLTH-010
  - EVD-HLTH-007
  - EVD-POTS-008
  evidence_level: E2-E3
  confidence: moderate
  implementation: NEW (repo PPG respiration is a cosmetic 0.25 Hz sine - replace)
  validation: 5th/95th percentile vs KORA-FF4
- parameter: circadian_period
  meaning: Endogenous circadian period
  units: h
  distribution:
    type: normal
    mean: 24.183
    sd: 0.267
  bounds:
  - 23.5
  - 25.0
  population_dependence: age phase advance 1-2 h
  condition_dependence: {}
  temporal_behavior: 24-h carrier
  equation: X(t)=MESOR+A*cos(2pi(t-phi)/24h)
  source:
  - EVD-TEMP-006
  evidence_level: E5
  confidence: high
  implementation: NEW (time_engine has clock but D_circ never couples to parameters - WIRE IT)
  validation: significant 24-h cosinor in synthetic HR
- parameter: circadian_HR_amplitude
  meaning: HR circadian double-amplitude half-range
  units: bpm
  distribution:
    type: normal
    mean: 13.5
    sd: 1.0
  bounds:
  - 8
  - 20
  population_dependence: identical amplitude/phase across sex (mesor differs)
  condition_dependence:
    pots: orthostatic gain AM bias +8-10 bpm (separate mechanism layer)
  temporal_behavior: 24 h
  equation: HR circadian term, acrophase ~14:40 lab / ~16:30-17:00 free-living
  source:
  - EVD-HLTH-003
  - EVD-POTS-002
  evidence_level: E2
  confidence: moderate
  implementation: NEW
  validation: acrophase afternoon; nadir 03:00-05:00
- parameter: Tcore_circadian
  meaning: Core temperature circadian rhythm
  units: degC
  distribution:
    type: cosinor
    mesor: 36.9
    half_amplitude: 0.25
    nadir: 04:00-06:00
  bounds:
  - 35.5
  - 39.5
  population_dependence: amplitude damped 20-40% elderly; phase advances with age; luteal +0.3-0.4 C offset
  condition_dependence:
    fever: see fever_slope_age_graded
    menstrual: luteal setpoint offset
  temporal_behavior: 24 h + sleep-evoked -0.2-0.3 C component (provisional E1)
  equation: T_core(t) = 36.9 + 0.25*cos(2pi(t-phi_T)/24h)
  source:
  - EVD-TEMP-006
  - EVD-TEMP-008
  evidence_level: E5
  confidence: high
  implementation: NEW (no temperature state in repo)
  validation: amplitude ~0.5 C; nadir timing
- parameter: sleep_stage_HR_deltas
  meaning: Stage-conditioned HR offsets vs recumbent wake
  units: bpm
  distribution:
    type: categorical_offsets
    N3: -0 to -5% vs recumbent wake
    REM: baseline + phasic bursts +5-15 bpm
    note: ONLY 13.5% dip >=10% vs recumbent wake; 20-30% dip exists only vs ambulatory day
  bounds: null
  population_dependence: younger/male/lower-BMI dip more; women higher sleep HR all stages
  condition_dependence:
    mecfs: SE -3-6%, SOL +7-10 min, TST normal (no hypersomnia)
  temporal_behavior: 90-min ultradian cycles
  equation: stage-conditioned state machine (REL-SLEEP-AUTONOMIC)
  source:
  - EVD-HLTH-007
  - EVD-MECFS-012
  evidence_level: E4
  confidence: moderate-high
  implementation: NEW (repo never enters sleep; is_sleeping hardcoded False)
  validation: stage-conditional HR/HF vs Huang 2018 / Cabiddu 2012
- parameter: BP_resting_and_dip
  meaning: Seated/24-h BP profile, nocturnal dip, morning surge
  units: mmHg
  distribution:
    type: composite
    seated: SBP N(112-118, 10), DBP N(70-76, 8) age 20-40
    dip: N(14.1, 4.6)% SBP
    surge: +15-25 mmHg over 30-60 min at awakening
    dipper_fractions: dipper 80-85% / non-dipper 10-15% / extreme-reverse ~5%
  bounds:
  - 70
  - 200
  population_dependence: men +~7 mmHg SBP; age slope +0.3-0.5 mmHg/y; between-population offsets 5-10 mmHg
  condition_dependence:
    mecfs_severe: supine hypertension / reverse dipping possible
    medication: levodopa post-dose OH (NEUR-005)
  temporal_behavior: 24 h cosinor + awakening surge kernel
  equation: SBP(t) = MESOR + 10*cos(2pi(t-14:15)/24h) + surge_kernel
  source:
  - EVD-HLTH-003
  - EVD-HLTH-009
  evidence_level: E2
  confidence: moderate
  implementation: NEW (semi-latent for wearables; cuffless PPG-BP cannot observe)
  validation: ABPM table reproduction; dip phenotype fractions
- parameter: BRS_operating_point
  meaning: Cardiovagal baroreflex sensitivity, method-conditional
  units: ms/mmHg
  distribution:
    type: lognormal
    mean: 10-15 (sequence/spectral) / 15-20 (phenylephrine scale)
    sd_over_mean: 0.45
  bounds:
  - 1
  - 40
  population_dependence: halve per ~20 y of age (19.5 -> 10.7 -> 6.0 across 23-39/40-59/60-77 y)
  condition_dependence:
    pots: CONTRADICTORY - sample delta N(-0.20, 0.10) trunc [-0.35,+0.10]; pediatric branch positive (do-not-hard-code item 1)
    sleep_deprivation: decreased spontaneous BRS (Zhong 2005, direction only)
  temporal_behavior: state-dependent (sleep raises BRS); method bias fixed per analysis method
  equation: BRS_method = BRS_true * method_scale (sequence/spectral underestimate 33-67%)
  source:
  - EVD-AUTN-002
  - EVD-POTS-010
  evidence_level: E4
  confidence: high for method bias; low for POTS delta
  implementation: maps to repo Hill gains kH/kE/kR only loosely - document mapping or introduce NEW effective-gain parameter
  validation: sequence-method analysis of synthetic data recovers prescribed gain within method bias
- parameter: orthostatic_protocol_deltas
  meaning: Protocol-conditioned healthy orthostatic delta-HR (MANDATORY encoding)
  units: bpm
  distribution:
    type: per_protocol_normals
    stand_casual_10min:
      mean: 12
      sd: 5
      exceed30: <5%
    stand_lab_vanderbilt_10min:
      mean: 25
      sd: 6
      exceed30: ~10-33%
    nasa_lean_10min:
      mean: ~20-28 (free-tailed)
      exceed30: 33% (Lee 2020)
    tilt60_10min:
      mean: 34
      sd: 8
      exceed30: ~40-60%
    tilt60_30min:
      mean: 40
      sd: 8
      exceed30: ~80%
  bounds:
  - -10
  - 60
  population_dependence: 'adolescents: 95th pct 41-48 bpm (pediatric criterion >=40); age attenuates orthostatic tachycardia'
  condition_dependence:
    pots: delta-HR(t) trajectory with 2-10-min separation; >=30 sustained adults / >=40 ages 12-19
    mecfs: SMD +0.86-0.92
  temporal_behavior: transient (s) + sustained (min) + drift (2-5 bpm/10 min)
  equation: delta_HR(t, protocol, supine_rest_duration, fasting, time_of_day) - all modeled variables
  source:
  - EVD-HLTH-004
  - EVD-POTS-001
  - EVD-POTS-005
  - EVD-POTS-018
  evidence_level: E3-E4
  confidence: moderate (protocol spread is the honest representation)
  implementation: NEW protocol registry consumed by engine (repo tilt_test.yaml is data-only, unparsed - wire it); relaxes repo test 'healthy
    sustained delta-HR < 30'
  validation: exceedance fractions per protocol vs Plash 2013 / Lee 2020 / Seeley 2025
- parameter: orthostatic_pooling_volume
  meaning: Blood volume shifted below diaphragm on standing
  units: mL
  distribution:
    type: uniform
    min: 300
    max: 800
  bounds:
  - 100
  - 1200
  population_dependence: body-size scaled
  condition_dependence:
    pots_flow_phenotypes: thoracic -25..-32% vs control -12+/-3% (Stewart, replication low)
    heds: optional untested pooling perturbation
  temporal_behavior: bulk <10 s, complete 3-5 min; plasma -10%/5 min, -15-20%/10 min
  equation: two-time-constant central volume dynamics
  source:
  - EVD-AUTN-005
  - EVD-TEMP-003
  - EVD-POTS-007
  evidence_level: E4
  confidence: high (direction), moderate (magnitude)
  implementation: repo states Vvm/Vsr exist; magnitudes tier C machine-fitted - keep with provenance label
  validation: pooling >=350 mL at 100 s; steady state in [500,1000] mL
- parameter: meal_kernel
  meaning: Postprandial HR/CO/glucose kernel
  units: bpm / mg/dL
  distribution:
    type: kernel_params
    dHR_mixed: N(6,3) bpm
    dHR_large: U(10,20) bpm
    peak_min: U(30,60)
    tau_decay_min: U(60,90)
    glucose_peak: +40+/-15 mg/dL at 45-65 min, <140 mg/dL healthy
  bounds: null
  population_dependence: elderly PPH -11 to -16 mmHg (~40% prevalence)
  condition_dependence:
    pots: high-carb splanchnic pooling pulse amplifies delta-HR (~53% report worsening)
  temporal_behavior: rise 0-60 min, resolve 2-4 h; duration ~ meal size
  equation: asymmetric kernel scaled by kcal and carb fraction (REL-MEAL-RESPONSE)
  source:
  - EVD-HLTH-006
  - EVD-METB-005
  - EVD-METB-002
  - EVD-POTS-016
  evidence_level: E3-E4
  confidence: moderate-high
  implementation: replaces repo behavior.py uncited meal constants (RalpM/Ralpm x0.75, Cal x1.15) with kernel-driven modulation
  validation: peak timing 30-60 min; meal-size grading
- parameter: PEM_symptom_kernel_params
  meaning: PEM delayed symptom kernel (ME/CFS)
  units: h / days
  distribution:
    type: composite
    onset_delay: Gamma(mode 18 h, range 0-48 h)
    peak: U(24,48) h
    recovery: right-skewed mean 12.7+/-1.2 d, IQR 5-21, range 1-64, tail 5-10% >21 d
    decay: N(0.10, 0.02) units/day
  bounds: null
  population_dependence: person-specific exertion threshold (state-dependent)
  condition_dependence:
    mecfs: defining
    long_covid: shared machinery; background PEM 7% in controls
  temporal_behavior: 12 h to weeks
  equation: delayed gamma kernel + right-skewed recovery (REL-PEM-SYMPTOM-KERNEL)
  source:
  - EVD-MECFS-008
  - EVD-MECFS-009
  - EVD-MECFS-001
  evidence_level: E4
  confidence: moderate (single-source amplitude/decay; mean NOT median per review)
  implementation: REPLACES repo time_engine.py PEM constants (12-h delay / 0.6 threshold / 2-h resolution - off by ~2 orders of magnitude AND
    dead code; engine.py:120 never passes exertion)
  validation: onset-delay/duration vs Chu 2018; mean 12.7 d vs Moore 2023
- parameter: EDA_tonic_phasic
  meaning: EDA SCL/SCR generator parameters
  units: uS
  distribution:
    type: composite
    SCL: random walk 2-16 uS (range 1-40)
    SCR_amplitude: lognormal 0.05-5 uS (min 0.01-0.05)
    SCR_latency: N(1.8,0.4) s
    SCR_rise: 0.5-5 s
    half_recovery: 2-10 s
    NS_SCR_rate: 1-3/min rest, 5-10+/min stress, up to 20-25 high arousal
  bounds:
  - 0
  - 45
  population_dependence: wide; wrist weaker than palmar; ambient heat/humidity raise SCL independent of arousal
  condition_dependence:
    stress: REL-STRESS-SAM-HPA
    note: dissociable from cardiac sympathetic - do not force coherence
  temporal_behavior: seconds (phasic) / minutes (tonic)
  equation: sudomotor burst input -> impulse response (delay 1-3 s, rise 1-3 s, tau_rec 3-10 s)
  source:
  - EVD-AUTN-010
  - EVD-SENS-006
  evidence_level: E4
  confidence: high
  implementation: NEW
  validation: SCR shape parameters within standard ranges
- parameter: MSNA_resting
  meaning: Resting muscle sympathetic nerve activity (latent)
  units: bursts/min
  distribution:
    type: lognormal
    mean: 22
    sd: 6
    note: 24+/-6; range 9-41; 4-fold interindividual range is a defining feature
  bounds:
  - 5
  - 50
  population_dependence: predominantly male source data; resting MSNA does NOT correlate with vasoconstrictor tone in young women
  condition_dependence:
    pots: supine usually normal, upright exaggerated (208+/-30 vs 123+/-24 %baseline on 30-deg HUT) BUT contradictions (Furlan/Jacob low) - state-dependent
      gain + high-resting tail
  temporal_behavior: stable trait; pulse-synchronous latency 1.3 s
  equation: MSNA ~ lognormal; orthostatic ~1.5-2x
  source:
  - EVD-AUTN-001
  - EVD-POTS-009
  - EVD-AUTN-005
  evidence_level: E4
  confidence: moderate
  implementation: NEW latent (not wearable-observable)
  validation: orthostatic doubling in synthetic drive
- parameter: sensor_PPG_HR_error
  meaning: Wrist PPG HR measurement error (Apple-Watch-class)
  units: bpm
  distribution:
    type: composite
    bias: -0.27
    LoA:
    - -7.19
    - 6.64
    sigma_rest: 3.5
    exercise_MAPE: 5-10% moderate; tails +/-19-30 bpm severe motion; arrhythmia degrade ~5x
  bounds: null
  population_dependence: skin-tone penalty UNRESOLVED - sample with mass at ~0 (do-not-hard-code item 13); pediatric/ambulatory tails wider
  condition_dependence:
    all: error widening with motion; cadence-lock artifact during rhythmic gait
  temporal_behavior: state-conditional
  equation: HR_obs = HR_true + bias + sigma(state)*eps + cadence_lock_artifact(state)
  source:
  - EVD-SENS-001
  - EVD-SENS-004
  - EVD-SENS-005
  evidence_level: E5 (bias/LoA); E2 (skin tone)
  confidence: high (Lambe 2026, 82 studies)
  implementation: 'REPO FIX: wearable_sensors.py hardcoded sigma=1ms/dropout 0.5% and PPG coefficients ignore KB validation data (Polar H10 LoA
    -2.3/+2.4 ms, ICC 0.99) - wire KB metrics in'
  validation: synthetic error distribution vs pooled LoA; naive-vs-SOTA cadence-lock reproduction
- parameter: sensor_PPG_usable_fraction
  meaning: Free-living PPG data-usability / missingness
  units: fraction
  distribution:
    type: state_conditional_bernoulli
    day: p_usable 0.30-0.60
    night: 0.65-0.75
    streaming_loss: up to 49% BLE vs <=9% on-device
  bounds:
  - 0
  - 1
  population_dependence: device-specific (E4-device)
  condition_dependence: {}
  temporal_behavior: diurnal missingness pattern
  equation: dropout ~ Bernoulli(p(state)); forward-fill policy explicit
  source:
  - EVD-SENS-003
  evidence_level: E4
  confidence: high
  implementation: 'REPO FIX: replace fixed 0.5% dropout'
  validation: synthetic missingness diurnal profile vs published fractions
- parameter: sensor_strap_RR_error
  meaning: Chest-strap RR-interval and derived-HRV metric error
  units: ms
