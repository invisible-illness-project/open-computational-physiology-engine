    class: biphasic cyclic modulator
    equation: 'luteal: T_skin +0.2-0.3 C (up to 0.5 individually; ring-detectable 0.30+/-0.12 C), RHR +2-7 bpm (+3.8 mid-luteal, n=91), RMSSD
      x0.9 (-4-5 ms), SDNN -12%; T_core setpoint +0.3-0.4 C luteal; T_cycle ~ N(28.6, 3.8) d'
    notes: 'MUST be present in healthy female personas so it is not misread as flare/infection (overlap-matrix item 12). DO-NOT-HARD-CODE (audit
      item 23): verified lab n=26; large-N source (Oura 48,720 cycles) is a conference abstract; per-person heterogeneity high - sample per-person
      effect multipliers.'
  quantitative_parameters:
  - name: luteal_Tskin_offset
    distribution:
      type: normal
      mean: 0.25
      sd: 0.08
      units: degC
  - name: luteal_RHR_offset
    distribution:
      type: uniform
      min: 2
      max: 7
      units: bpm
  - name: luteal_RMSSD_multiplier
    distribution:
      type: normal
      mean: 0.9
      sd: 0.05
  - name: cycle_length
    distribution:
      type: normal
      mean: 28.6
      sd: 3.8
      units: days
  timescale: ~monthly
  condition_dependence:
    healthy_female: as above
    interaction: stacks with disease RHR/HRV perturbations (additive-on-log-scale for HRV recommended; review P2 item 11)
  evidence_level: E3
  source_claims:
  - EVD-TEMP-008
  - EVD-SENS-007
  uncertainty: effect heterogeneity across individuals high; detection-rate falsification target 82%
  contradiction_level: low
  validation: synthetic biphasic pattern detectable by standard cycle detection (~82% detection rate as falsification target)
- id: REL-MEDICATION-MASKS
  name: Medication gain masks (cross-disease confound layer)
  variables:
    inputs:
    - medication_state (drug, dose)
    outputs:
    - gain multipliers on HR ceiling / baroreflex / inflammation coupling / volume
  direction: beta-blockers blunt HR/HRV/orthostatic response; steroids raise RHR, degrade sleep, decorrelate CRP-proxy from RHR; midodrine works
    only in neuropathic subtype; compression dose-dependent
  functional_form:
    class: gain multipliers / ceiling shifts applied to specific limbs (masks), NOT global offsets
    equation: 'beta_blocker: HR impulse gain x~0.5, HM ceiling lowered (repo experimental HM 3.33->2.2 bps has NO quantitative source - keep tier
      D); propranolol 20 mg lowers supine/standing HR, 80 mg LESS symptom benefit; ivabradine: stand-supine delta-HR 13.1 vs 17.0 bpm; midodrine:
      acute standing HR 114->92.8 (neuropathic only); compression: tilt HR 109->92 (full); fludrocortisone: TotalVol +~500 mL ACUTE ONLY (magnitude
      assumption, sample ±50%); chronic phase pressor TPR-mediated - schema cannot express; steroids: RHR +2-8 bpm dose-scaled high variance,
      sleep efficiency -5-15%'
    notes: fludrocortisone has NO adequate RCT in POTS (coverage gap 11) yet is a canonical repo perturbation - label assumption. POTS medication
      effect sizes are point estimates from n=9-54 crossovers (fabricated-precision flag B2) - distributions mandatory. Prescription-prevalence
      distributions do not exist (E0).
  quantitative_parameters:
  - name: beta_blocker_HR_gain
    distribution:
      type: uniform
      min: 0.4
      max: 0.6
    note: provisional
  - name: steroid_RHR_offset
    distribution:
      type: uniform
      min: 2
      max: 8
      units: bpm
    note: all indirect evidence (do-not-hard-code item 17)
  - name: steroid_sleep_efficiency
    distribution:
      type: uniform
      min: -0.15
      max: -0.05
      units: fraction
  - name: fludrocortisone_volume
    distribution:
      type: normal
      mean: 500
      sd: 250
      units: mL
    note: sample ±50%; acute_to_early_chronic_only
  - name: compression_tilt_HR
    value: 109+/-19 -> 92+/-14 bpm (full compression, Bourne 2021)
  timescale: acute to hours (most); weeks-months (steroids, biologics); fludrocortisone chronic phase unencodable
  condition_dependence:
    pots: 'subtype-dependent response: midodrine neuropathic-only; exercise training superior to propranolol (EVD-POTS-013, single n=19 - do not
      hard-code remission)'
    autoimmune: steroid state decorrelates CRP-proxy from RHR (confound stress test)
  evidence_level: E3 (POTS acute trials); E2 (steroids); E0 (fludrocortisone efficacy)
  source_claims:
  - EVD-POTS-015
  - EVD-AUTO-009
  - EVD-POTS-013
  uncertainty: small n, short endpoints; dose-response mostly unknown; repo beta-blocker validation check currently vacuous in canonical mode
  contradiction_level: low-moderate
  validation: 'compression dose-response as intervention sanity check; confound stress test: steroid state decorrelates CRP-proxy from RHR'
- id: REL-INFLAMMATION-IMPULSE
  name: Acute systemic inflammation impulse and chronic low-grade inflammation coupling
  variables:
    inputs:
    - inflammatory_trigger (LPS-analog severity / flare state)
    outputs:
    - HR
    - core_temperature
    - HRV
    - MAP
    - REE
  direction: 'acute: HR/temp up, HRV down, MAP down - stereotyped transient storm; chronic low-grade: small HRV reduction, RHR slightly up'
  functional_form:
    class: acute impulse kernel (log-dose severity analog) + slow chronic latent coupling
    equation: 'acute (LPS 2 ng/kg analog): onset 1-2 h, peak 3-5 h, recovery 8-24 h; HR peak +40-55%, Tcore +1-1.75 C, HRV gain 0.4-0.7, MAP ~-15%;
      dose-response: vitals unchanged <=0.5 ng/kg, HRV changes from ~1 ng/kg; chronic: RMSSD/SDNN gain 0.85-0.95, RHR +1-4 bpm, |r|~0.1 with CRP'
    notes: hydrocortisone blunts cytokines but does NOT block HRV depression; LF/HF inconsistent - do not model as sympathovagal balance; TNF-alpha
      association NULL (required null-fidelity test).
  quantitative_parameters:
  - name: acute_HR_peak
    distribution:
      type: uniform
      min: 0.4
      max: 0.55
      units: fraction
  - name: acute_Tcore
    distribution:
      type: uniform
      min: 1.0
      max: 1.75
      units: degC
  - name: acute_HRV_gain
    distribution:
      type: uniform
      min: 0.4
      max: 0.7
  - name: chronic_RMSSD_gain
    distribution:
      type: uniform
      min: 0.85
      max: 0.95
  - name: RA_flare_offsets
    value: RHR +5.0 bpm, night HR +5.5, RMSSD mesor -25%, steps -515/d symptomatic-only; slow 2-4 wk ramp preceding flare (EVD-AUTO-005; within-person
      offsets survive, classifier AUC~1.00 does NOT)
  timescale: acute hours; flare ramp 2-4 weeks; chronic weeks-years
  condition_dependence:
    healthy_acute: as above (young male over-represented in source data)
    ra_ibd: flare replay offsets above; IBD AUC claims = optimistic upper bounds, never emit as validated
  evidence_level: E4 (acute); E5 (chronic CRP/IL-6 direction, |r|~0.1); E2 (flare offsets)
  source_claims:
  - EVD-AUTO-001
  - EVD-AUTO-002
  - EVD-AUTO-005
  - EVD-AUTO-010
  uncertainty: low-grade inflammation sits BELOW acute-vitals detection threshold; endothelial/temperature-setpoint/PPG-stiffness effects latent-only
    (EVD-AUTO-011)
  contradiction_level: low
  validation: replay vs digitized Jan 2009/Dorresteijn 2010 time series (RMSE on HR, temperature); synthetic cohort CRP-RMSSD correlation small-negative;
    TNF ~0 (null fidelity)
- id: REL-STRESS-SAM-HPA
  name: Acute psychosocial stress (TSST-like) two-arm response
  variables:
    inputs:
    - psychosocial_stressor
    outputs:
    - HR
    - SBP
    - EDA
    - HRV
    - cortisol (latent)
  direction: fast SAM arm (HR/SBP/EDA up, HRV down) + slow HPA arm (cortisol); cortisol habituates with repetition, SAM does NOT
  functional_form:
    class: two-arm event model with habituation asymmetry + responder structure
    equation: 'SAM: HR +10-35 bpm (meta ES 0.89 youth), SBP ES 1.17, EDA surge, RMSSD drop ES -0.33, peak minutes, recovery 10-30 min; HPA: cortisol
      +50-100% (d=0.93 adult), peak 15-20 min post-stressor, recovery 30-70 min; habituation: cortisol-only on repeat; responder rate ~64-70%;
      male cortisol > female'
    notes: 'panic attacks are REALISTIC-MODEST, not textbook dramatic: HR surge +10-30 bpm high variance, many attacks HR-invariant; hyperventilation
      itself only +4.4 bpm (EVD-NEUR-010). Panic vs TSST vs ictal tachycardia must be HARD TO SEPARATE by HR alone (negative-control test).'
  quantitative_parameters:
  - name: SAM_HR_delta
    distribution:
      type: uniform
      min: 10
      max: 35
      units: bpm
  - name: cortisol_peak_delay
    distribution:
      type: uniform
      min: 15
      max: 20
      units: min
  - name: responder_fraction
    distribution:
      type: uniform
      min: 0.64
      max: 0.7
  - name: EDA_SCR
    value: latency 1-4 s, rise 0.5-5 s, amplitude 0.05-5 uS log-normal, half-recovery 2-10 s; NS-SCR 1-3/min rest -> 5-10+/min stress
  timescale: minutes (SAM) to ~1 h (HPA)
  condition_dependence:
    healthy: as above
    anxiety_disorders: TONIC vmHRV reduction g~-0.3 to -0.45 with NO reactivity difference (EVD-NEUR-009 E5) - trait layer, not event layer; effect
      disappears controlling for psychotropics in large-N
  evidence_level: E5 (TSST meta); E2 (panic magnitude)
  source_claims:
  - EVD-NEUR-011
  - EVD-NEUR-010
  - EVD-NEUR-009
  - EVD-AUTN-010
  - EVD-SENS-006
  uncertainty: small-study inflation (r=-0.24 sample-size bias); VR/online variants attenuate cortisol; no large ambulatory panic dataset (coverage
    gap 10)
  contradiction_level: low (TSST); high (panic stereotype refuted)
  validation: 'virtual TSST: dHR ES ~0.9, dSBP ES ~1.2, cortisol ES ~0.5-0.9; cortisol-only habituation on repeat; EDA events need not covary
    with cardiac sympathetic (dissociation test)'
- id: REL-HRV-GENERATION-STRUCTURE
  name: Beat-interval generative structure (1/f fractal + point-process + metric emergence)
  variables:
    inputs:
    - vagal_limb_output
    - sympathetic_limb_output
    - respiratory_gating
    - fractal_modulation
    outputs:
    - RR series
    - RMSSD/SDNN/LF/HF/DFA-alpha1 (emergent)
  direction: structured variability emerges from limbs + gating + 1/f noise; NEVER inject metric values directly
  functional_form:
    class: IPFM or inverse-Gaussian point-process beat generator + additive fractal (1/f) noise
    equation: DFA-alpha1 ~ 1.0 (0.7-1.2) at rest, declining with exercise intensity and disease; RR intervals history-dependent inverse-Gaussian
      (KS-validated); repo's uniform +/-2% multiplicative noise is NOT physiologically structured and must be replaced
    notes: no evidence higher-complexity generators beat simple models; multiscale entropy is the bar separating synthetic from real. LF/HF must
      NEVER be generated as a direct sympathovagal label.
  quantitative_parameters:
  - name: DFA_alpha1_rest
    distribution:
      type: uniform
      min: 0.7
      max: 1.2
      mean: 1.0
  - name: weekly_lnRMSSD_CV
    distribution:
      type: uniform
      min: 0.03
      max: 0.1
    note: athletes; OU baseline drift tau 3-7 d reproduces this
  - name: hrv_noise_repo
    value: 0.02 uniform - REPLACE with structured generator
  timescale: beat-to-beat to weeks
  condition_dependence:
    healthy: as above
    disease_general: 'alpha1 declines with disease/exercise; POTS: reduced time-domain variability with ambiguous frequency-domain (do NOT model
      as generically ''low HRV'', EVD-POTS-011)'
  evidence_level: E4 (fractal structure); E2 (generator class)
  source_claims:
  - EVD-TEMP-001
  - EVD-TEMP-002
  - EVD-TEMP-011
  - EVD-AUTN-006
  - EVD-POTS-011
  - EVD-TEMP-007
  uncertainty: each generator validation single-study; IPFM does not by itself produce 1/f structure
  contradiction_level: none
  validation: DFA-alpha1 of synthetic RR ~1.0 at rest, declining with exercise; multiscale entropy indistinguishable-from-real test; spectral
    peaks at 0.1 Hz and respiratory band
- id: REL-DAY-TO-DAY-DRIFT
  name: Within-person day-to-day drift (OU processes) and measurement reliability
  variables:
    inputs:
    - OU state per channel
    outputs:
    - daily RHR
    - daily lnRMSSD
    - sleep duration
    - steps
  direction: slow mean-reverting drift around stable traits
  functional_form:
    class: Ornstein-Uhlenbeck baseline drift
    equation: dx = -(x - mu)/tau_OU dt + sigma_OU dW; tau_OU 3-7 d; RHR day-to-day CV ~4.6% (within-person SD 3.03 bpm, Quer n=92,457); 5-day
      ICC 0.87; RMSSD 5-day ICC 0.66 (0.32-0.86); lnRMSSD CV 3-13% standardized / 0.37 uncontrolled (protocol effect); sleep single-night ICC
      0.27-0.38; steps need 2.5-4.4 d for ICC>=0.8
    notes: 'RECONCILED (review P0 item 4): within-person RHR SD fixed from Quer 2020 (~3.0 bpm, CV 4.6%), superseding HEALTHY dossier E0 ''est
      3-6 bpm''. HEALTHY within-person claim stays do-not-hard-code until reconciled at generation time - use POPULATION values.'
  quantitative_parameters:
  - name: RHR_within_person_SD
    distribution:
      type: normal
      mean: 3.03
      sd: 0.5
      units: bpm
  - name: lnRMSSD_CV_standardized
    distribution:
      type: uniform
      min: 0.03
      max: 0.13
  - name: sleep_duration_within_SD
    value: median 0:30 h
    units: h
  - name: orthostatic_event_reliability
    value: CV 15-25% PROVISIONAL - no test-retest study exists (coverage gap 5)
  timescale: days to weeks
  condition_dependence:
    healthy: as above
    mecfs: steps day-to-day variation mean 47% (range 25-79%); boom-bust amplitude LARGER in milder patients; boom-bust via PEM kernel autocorrelation,
      not i.i.d. noise (EVD-MECFS-011)
    overreaching: lnRMSSD CV 8.1% during functional overreaching vs 2.8% stable (single case study)
  evidence_level: E4
  source_claims:
  - EVD-POP-004
  - EVD-TEMP-007
  - EVD-HLTH-001
  - EVD-MECFS-011
  uncertainty: orthostatic reliability unmeasured; athlete OU parameters athlete-specific
  contradiction_level: none
  validation: synthetic day-series ICCs match published (RHR 0.87, RMSSD 0.66, sleep 0.27-0.38)
- id: REL-TRAINING-ADAPTATION
  name: Slow training/fitness adaptation state (and POTS exercise-training response)
  variables:
    inputs:
    - training_load_history
    outputs:
    - RHR
    - RMSSD/HF
    - HRmax (near-unchanged)
    - blood_volume
    - LV_mass
  direction: 'training block: RHR down, HRV up over 8-12 wk; detraining reverses over weeks'
  functional_form:
    class: slow saturating adaptation state F (OU-like with input)
    equation: dF = (training_input - F)/tau_F dt, tau_F 2-6 wk; RHR -= (2-6 bpm)*F; RMSSD/HF up SMD 0.6-0.9 equivalent; endurance-trained resting
      HR -8 to -12 bpm (athletes 40-55 bpm)
    notes: 'POTS training branch (Fu 2010/2011): LV mass +12%, blood volume +7%, upright HR -9 [1-17] bpm, 10/19 no longer met criteria - SINGLE
      n=19 completers-only study, no replication; remission fraction must NOT be hard-coded (do-not-hard-code item 3); deconditioning-as-cause
      contested.'
  quantitative_parameters:
  - name: tau_adaptation
    distribution:
      type: uniform
      min: 2
      max: 6
      units: weeks
  - name: RHR_training_delta
    distribution:
      type: uniform
      min: -6
      max: -2
      units: bpm
  - name: HRV_training_SMD
    distribution:
      type: uniform
      min: 0.58
      max: 0.89
    note: SDNN 0.58, RMSSD 0.84, HF 0.89; CIs wide
  - name: pots_training_branch
    value: BV +7%, LV mass +12%, upright HR -9 bpm; remission ~53% as SAMPLED uncertain, not canonical
  timescale: weeks to months
  condition_dependence:
    healthy: as above
    pots: training intervention = parameter trajectory (volume + LV mass + upright HR), not instant remission; supports deconditioning/hypovolemia
      competing branch (Fu 2010)
  evidence_level: E4 (training->HRV meta); E3 (POTS training, downgraded)
  source_claims:
  - EVD-TEMP-009
  - EVD-POTS-013
  uncertainty: heterogeneous training programs; detraining E4-level only
  contradiction_level: moderate
  validation: 'synthetic 8-12 wk training block: RMSSD weekly-mean rise SMD 0.6-0.9 equivalent; RHR -2-6 bpm'
- id: REL-HR-RMSSD-SCALING
  name: HR-RMSSD coupling (RR-interval scaling law; binding correction to fixed correlation)
  variables:
    inputs:
    - mean_RR_interval
    - vagal_state
    outputs:
    - RMSSD
  direction: RMSSD mechanically scales with RR interval; residual vagal signal secondary
  functional_form:
    class: mathematical scaling + weak residual
    equation: RMSSD ~ c * RR^alpha (alpha ~0.5-1, van Roon 2016 / de Geus 2019 class); between-person population r(HR,RMSSD) emerges from scaling
      + vagal covariance; DO NOT hard-code r=-0.58 (children-only anchor, n=626)
    notes: 'BINDING (contradiction audit Target 6): use RR-scaling law + weak residual for adults; within-person delta-RMSSD (device-stable) preferred
      over absolute cross-device values. Population r downgraded to E1/E2.'
  quantitative_parameters:
  - name: scaling_exponent
    distribution:
      type: uniform
      min: 0.5
      max: 1.0
    note: provisional
  - name: population_r_residual
    distribution:
      type: uniform
      min: -0.3
      max: -0.1
    note: provisional with sensitivity at r=0
  timescale: chronic (trait) + beat-by-beat (mechanical)
  condition_dependence:
    healthy: as above
  evidence_level: E2 (scaling); E1-E2 (population r after downgrade)
  source_claims:
  - EVD-POP-005
  - EVD-POP-002
  uncertainty: adult population r genuinely unevidenced beyond scaling law
  contradiction_level: resolved-by-audit (children-only anchor)
  validation: synthetic HR-RMSSD between-person correlation emerges in [-0.6,-0.3] WITHOUT being planted; within-person deltas device-stable
