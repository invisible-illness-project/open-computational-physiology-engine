metadata:
  name: OCPE Physiological Relationships (Model Translation, Pass 3)
  generated_by: Model Translation Scientist
  inputs:
  - EVIDENCE_REGISTRY.yaml (143 claims)
  - EVIDENCE_AUDIT_NOTES.md
  - CONTRADICTION_AUDIT.md
  - INDEPENDENT_REVIEW_PASS2.md
  - CURRENT_IMPLEMENTATION_MAP.md
  - CURRENT_PHENOTYPE_SCOPE.md
  scale_note: 'All evidence_level values use the NORMALIZED standard scale from EVIDENCE_REGISTRY.yaml: E0=hypothesis, E1=mechanistic, E2=observational
    human, E3=controlled human experimental, E4=replicated quantitative, E5=meta-analysis/consensus. TEMPORAL_MODEL_EVIDENCE.md and WEARABLE_OBSERVABILITY_EVIDENCE.md
    use INVERTED scales; only registry-normalized values are used here. Auditor downgrades (EVIDENCE_AUDIT_NOTES.md, CONTRADICTION_AUDIT.md, INDEPENDENT_REVIEW_PASS2.md)
    are applied and are BINDING.'
  binding_constraints:
  - Every entry in the audit's must-not-be-hard-coded list is represented as a distribution/mixture/latent, never a point constant.
  - PEM symptom kernel (24-48 h delay, days-weeks recovery) is DECOUPLED from the physiological recovery kernel (slowed same-day recovery, hours).
    A delayed physiological second wave is E0, optional, default OFF.
  - Healthy orthostatic delta-HR is protocol-conditioned; the >95%-below-30-bpm constraint must NOT be enforced.
  - Fever/HR slope is age-graded (~13 child -> ~7-10 adult bpm/degC); 12.3 bpm/C is pediatric only.
  - POTS baroreflex gain contradiction (reduced vs unchanged vs increased) is a sampled latent, not a constant.
  - Geddes-derived perturbations are tier-D scenario samples with a competing Fu-2010 mechanism branch (small heart + hypovolemia, intact baroreflex).
  - RMSSD is generated from (vagal state, respiration, tidal volume, HR level, device bias); LF/HF never emitted as a sympathovagal label.
  - Condition dependence is expressed as perturbation deltas on the shared healthy reference, never duplicate models.
  conventions:
    distributions: structured dicts {type, params, units}; 'provisional' flagged inline
    evidence_level: normalized E0-E5 with auditor downgrades applied
    source_claims: claim_ids from EVIDENCE_REGISTRY.yaml; dossier-section refs given where no registry claim exists
relationships:
- id: REL-HR-SV-COMPENSATION
  name: Heart-rate to stroke-volume compensatory coupling (orthostasis, exercise, heat)
  variables:
    inputs:
    - stroke_volume (preload/venous-return determined)
    - posture
    - exercise_intensity
    - core_temperature
    outputs:
    - heart_rate
    - cardiac_output
  direction: SV fall drives compensatory HR rise to defend CO/MAP; in exercise SV plateaus at ~40-60% VO2max and further CO rise is HR-driven
  functional_form:
    class: algebraic identity + compensatory controller
    equation: 'CO = HR * SV ; upright: HR = HR_supine + g_sv * max(0, (SV_supine - SV_upright)/SV_supine) with g_sv person-specific; heat: SV
      decline above ~38C core is HR-mediated (filling-time), reversible by beta-blockade at matched HR'
    notes: HR must NOT be driven independently of SV/preload in orthostatic scenarios; the repo engine implements this implicitly via the 0-D
      hemodynamics + baroreflex loops.
  quantitative_parameters:
  - name: upright_SV_change
    distribution:
      type: normal
      mean: -0.23
      sd: 0.05
      units: fraction
      ci95:
      - -0.3
      - -0.16
    note: MRI supine->60deg HUT; classic -33%
  - name: upright_CO_change
    distribution:
      type: uniform
      min: -0.2
      max: -0.14
      units: fraction
  - name: upright_SVR_change
    value: +~25% to hold MAP
    units: fraction
  - name: sitting_vs_supine_SV
    value: 55+/-7 vs 76+/-8 mL (n=7, Poliner)
    units: mL
  timescale: beat-by-beat to minutes
  condition_dependence:
    healthy: as above
    pots: resting SV 69+/-3 vs 85+/-7 mL (Fu 2010); upright CO decreased in EVERY POTS patient (n=58, Stewart 2018); %CO reduction bimodal with
      -15% cutoff (van Campen n=226); delta-HR inversely related to delta-SV reserve until hyperadrenergic branch (delta-HR>=40) breaks the relation
    mecfs: 'severe: cardiac index -26+/-7% during tilt (EVD-MECFS-006)'
    heds: optional venous-capacitance perturbation only (mechanism untested, E0-E1)
  evidence_level: E3
  source_claims:
  - EVD-POTS-006
  - EVD-HLTH-004
  - EVD-AUTN-005
  - EVD-MECFS-006
  uncertainty: SV/CO are NOT wearable-observable (latent); subgroup percentages of bimodal CO reduction not fully retrieved
  contradiction_level: low
  validation: 'tilt simulation: upright CO decrease >10% in POTS personas vs <10% controls; HR rise inversely correlated with SV reserve across
    synthetic cohort'
- id: REL-RSA-RESPIRATORY-GATING
  name: Respiratory sinus arrhythmia (HR <-> respiration)
  variables:
    inputs:
    - respiration_rate
    - tidal_volume
    - vagal_gain
    - HR_level
    outputs:
    - RR_interval modulation at respiratory frequency
    - RMSSD
    - HF_power
  direction: inspiration shortens RR (vagal gating), expiration lengthens; RSA amplitude scales with tidal volume and inversely with respiration
    rate INDEPENDENTLY of vagal tone
  functional_form:
    class: phase-gated parasympathetic modulation
    equation: RR(t) = RR_mean + A_rsa * sin(2*pi*f_resp*t + phi); A_rsa ~ k_vt * tidal_volume / f_resp; RSA power attenuates -20 dB/decade above
      0.1 Hz
    notes: Respiration and HR are MECHANISTIC INPUTS to RMSSD/HF, not noise. Respiration alone (0.03-0.5 Hz) changes SDNN up to 33%, RMSSD 37%,
      LF 72%, HF 36%; breathing <9/min shifts respiratory power into the LF band.
  quantitative_parameters:
  - name: paced_6bpm_deep_breathing_maxmin_dHR
    value: '>=15 bpm normal; 11-14 borderline; <=10 abnormal (Ewing battery)'
    units: bpm
  - name: E_I_ratio_by_age
    value: 1.62 (age 16) -> 1.20 (age 70); lower normal limits >=1.36 (20s), 1.23 (30s), 1.14 (40s), 1.10 (50s), 1.06 (60s)
    units: ratio
  - name: resting_respiration_rate
    distribution:
      type: normal
      mean: 15.5
      sd: 2.3
      truncate:
      - 9
      - 28
      units: breaths/min
    note: 'KORA-FF4 n=2224: median 15.8, 5th-95th 12.1-20.1; athletes 10.5 vs 13.8'
  - name: resp_confound_magnitude
    value: RMSSD +/-37%, SDNN +/-33% across respiration rates at constant HR (Schipke 1999)
  timescale: seconds (within-breath)
  condition_dependence:
    healthy: as above; generate sympathetic and vagal drives independently and pass through respiratory gating
    pots: postural hyperventilation/hypocapnia subset ~25% (ETCO2<30 Torr) amplifies RSA-band power and reduces CBFv (EVD-POTS-008)
    mecfs: no direct evidence; do not perturb RSA independently of vagal-gain knob
  evidence_level: E4
  source_claims:
  - EVD-AUTN-006
  - EVD-HLTH-002
  - EVD-HLTH-010
  - EVD-TEMP-001
  - EVD-POTS-008
  uncertainty: 'exact tidal-volume scaling coefficient not pinned (E1-E2); REQUIRED TEST: paced 0.1-Hz breathing must inflate LF/HF with no sympathetic
    change'
  contradiction_level: none
  validation: synthetic RMSSD must vary up to ~37% across imposed respiration rates at constant mean HR; E/I ratio within age norms under deep-breathing
    protocol
- id: REL-AUTONOMIC-FILTERING
  name: Vagal/sympathetic latency and low-pass filtering of autonomic drive at the SA node
  variables:
    inputs:
    - vagal_drive
    - sympathetic_drive
    outputs:
    - chronotropic_effect_on_RR
  direction: vagal fast (sub-second), sympathetic delayed and slow
  functional_form:
    class: pure delay + first-order low-pass per limb
    equation: 'vagal: delay 0.2-0.6 s, tau_v 0.5-1.5 s (effective within same/next beat); sympathetic: delay ~1.5-2 s, tau_s 5-15 s; vagal bandwidth
      >=0.4-0.5 Hz, sympathetic <=0.1-0.15 Hz (physiological basis of HF/LF split)'
    notes: HRV content >0.15 Hz generated by the vagal limb only. MSNA burst latency 1.3+/-0.03 s post R-wave (shortens to 1.04 s at presyncope).
  quantitative_parameters:
  - name: vagal_delay
    distribution:
      type: uniform
      min: 0.2
      max: 0.6
      units: s
  - name: vagal_tau
    distribution:
      type: uniform
      min: 0.5
      max: 1.5
      units: s
  - name: sympathetic_delay
    distribution:
      type: uniform
      min: 1.5
      max: 2.0
      units: s
    note: canine pure delay 1.7 s
  - name: sympathetic_tau
    distribution:
      type: uniform
      min: 5
      max: 15
      units: s
    note: 'WIDE PRIOR: exact human SA-node sympathetic tau inferred, not directly measured; treat exact values as soft priors (registry EVD-TEMP-005
      = E1, do-not-hard-code list item 20)'
  timescale: sub-second to tens of seconds
  condition_dependence:
    healthy: as above
    mecfs: repo tier-D tauH 6.25->12 s / taur 12.5->25 s have NO supporting source; keep experimental-only
  evidence_level: E4
  source_claims:
  - EVD-AUTN-004
  - EVD-TEMP-005
  uncertainty: cross-dossier grading disagreement resolved in favor of AUTONOMIC (La Rovere/Berger/Saul) with wide-prior caveat on human sympathetic
    tau; exact latency values = soft priors only
  contradiction_level: low
  validation: 'simulated phenylephrine ramp: RR lengthens within 1 beat; sympathetic step: HR rise begins after ~2 s, 63% complete in 10-20 s'
- id: REL-BAROREFLEX-SIGMOID
  name: Carotid baroreflex logistic (sigmoid) HR/MAP response + operating-point gain
  variables:
    inputs:
    - carotid_sinus_pressure (MAP surrogate)
    outputs:
    - HR
    - MAP
    - SVR
  direction: pressure up -> HR/SVR down (negative feedback); sigmoid with threshold and saturation
  functional_form:
    class: 4-parameter logistic (Kent/Raven/Ogoh form); repo implements Hill targets on pcm
    equation: HR = A4 + A1/(1+exp(A2*(P-A3)))  [A1 range, A2 slope, A3 midpoint, A4 minimum]; Gmax = -A1*A2/4 at P=A3; use EXACT 5% Thr/Sat =
      A3 +/- 2.0/A2 (the common +/-2/A2 approximation underestimates operating range ~32%)
    notes: 'carotid-cardiac arc ~90% vagal at this timescale: muscarinic blockade collapses Gmax_HR -0.58 -> -0.06 bpm/mmHg. Repo mapping: Hill
      loops with kR/kE/kH, p2Ru/p2Ra/p2E/p2H, tauR/tauE/tauH, tauP=2.5 s pressure filter.'
  quantitative_parameters:
  - name: CBR_HR_range_A1
    distribution:
      type: normal
      mean: 17.1
      sd: 2.7
      units: bpm
  - name: CBR_slope_A2
    distribution:
      type: normal
      mean: 0.15
      sd: 0.03
      units: 1/mmHg
  - name: CBR_midpoint_A3
    distribution:
      type: normal
      mean: 99.9
      sd: 5.0
      units: mmHg
  - name: CBR_minHR_A4
    distribution:
      type: normal
      mean: 55.6
      sd: 1.8
      units: bpm
  - name: Gmax_HR
    distribution:
      type: normal
      mean: -0.58
      sd: 0.1
      units: bpm/mmHg
    note: carotid-only scale; whole-baroreflex gain larger
  - name: Gmax_MAP
    distribution:
      type: uniform
      min: -0.4
      max: -0.24
      units: mmHg/mmHg
  - name: BRS_operating_point
    value: young supine ~10-15 ms/mmHg (sequence/spectral), 15-20 ms/mmHg (phenylephrine scale); halve per ~20 y of age; lognormal, SD/mean ~0.4-0.5
    note: 'METHOD BIAS: sequence/spectral UNDERESTIMATE phenylephrine BRS by 33-67% - method must be a modeled variable'
  timescale: seconds
  condition_dependence:
    healthy: as above
    pots: 'CONTRADICTORY (do-not-hard-code item 1): Gmax -25% supine (Stewart 2021) vs unchanged (Fu 2010, Galbreath 2011) vs INCREASED pediatric.
      Sample gain delta from ~N(-0.20, 0.10) truncated [-0.35, +0.10] as latent uncertainty; pediatric branch positive; NO point constant.'
    post_mi_chf_anchors: BRS ~7-8 (post-MI), ~2-4 (CHF); BRS<3 ms/mmHg -> RR 2.8 cardiac mortality (ATRAMI)
  evidence_level: E3
  source_claims:
  - EVD-AUTN-003
  - EVD-AUTN-002
  - EVD-POTS-010
  uncertainty: canonical parameter set rests on n=9 (Ogoh/Raven lab) - point estimates, NOT population distributions (do-not-hard-code item 15);
    method-scale dependence must be encoded
  contradiction_level: high (POTS gain); none (healthy logistic form)
  validation: neck-suction impulse simulation reproduces Gmax and glycopyrrolate sensitivity; sequence-method analysis of synthetic supine BP/HR
    recovers prescribed gain within documented method bias
- id: REL-BAROREFLEX-RESETTING
  name: Baroreflex resetting rule (exercise and posture)
  variables:
    inputs:
    - exercise_intensity
    - central_command
    - exercise_pressor_reflex
    outputs:
    - sigmoid_P3_P4_shift
    - operating_point
  direction: exercise resets sigmoid upward/rightward with PRESERVED maximal gain; operating point moves toward threshold (OP gain falls geometrically)
  functional_form:
    class: intensity-dependent operating-point shift (NOT gain reduction)
    equation: P3(exercise) = P3_rest + dP3 * intensity; P4(exercise) = P4_rest + dP4 * intensity; Gmax unchanged. Central command resets carotid-cardiac
      arc; central command OR pressor reflex resets carotid-vasomotor arc.
    notes: 'BRS falls within SECONDS at exercise onset (vagal withdrawal) while operating-point resetting is slower (tens of s to min). Post-exercise:
      rapid vagal reactivation resets back.'
  quantitative_parameters:
  - name: gain_fall_onset
    value: seconds (vagal withdrawal)
    units: s
  - name: OP_reset_tau
    value: tens of seconds to minutes
    units: s
  timescale: seconds to minutes
  condition_dependence:
    healthy: as above
    pots: no direct evidence; apply same structure
    mecfs: blunted peak HR ceiling applies (REL-EXERCISE-KINETICS)
  evidence_level: E4
  source_claims:
  - EVD-AUTN-008
  uncertainty: key human studies small (n=8); dP3/dP4 magnitudes per intensity not pinned - provisional
  contradiction_level: none
  validation: 'steady-state exercise: HR and BP rise in parallel with preserved sequence-analysis counts displaced rightward'
- id: REL-ACCENTUATED-ANTAGONISM
  name: Vagal-sympathetic interaction (accentuated antagonism)
  variables:
    inputs:
    - vagal_level
    - sympathetic_level
    outputs:
    - HR
  direction: vagal HR effect AUGMENTED by background sympathetic activity; interaction obligatory, not additive
  functional_form:
    class: multiplicative interaction
    equation: HR = f(vagal, symp) with vagal gain scaled by (1 + k * symp_level); branches NOT additive-independent
    notes: Levy 1971 direction is E4; the human interaction coefficient magnitude is E1-E2.
  quantitative_parameters:
  - name: interaction_coefficient_k
    distribution:
      type: uniform
      min: 1
      max: 3
    note: 'DO-NOT-HARD-CODE (audit item 14): tunable with mandatory sensitivity analysis'
  timescale: beat-by-beat
  condition_dependence:
    healthy: as above
  evidence_level: E4 (direction); E1-E2 (k magnitude)
  source_claims:
  - EVD-AUTN-009
  uncertainty: k uncertain; run sensitivity over k in [1,3]
  contradiction_level: none
  validation: 'sensitivity analysis over k; direction check: HR rise on vagal withdrawal larger at high sympathetic background'
- id: REL-INTRINSIC-HR
  name: Intrinsic heart rate and resting autonomic balance
  variables:
    inputs:
    - age
    - vagal_effect
    - sympathetic_effect
    outputs:
    - HR
  direction: resting HR < IHR in most healthy adults -> resting state is vagal-dominant
  functional_form:
    class: linear age model + multiplicative autonomic modulation
    equation: IHR = 118.1 - 0.57*age (Jose & Collison 1970); HR = IHR * (1 - vagal_effect) * (1 + sympathetic_effect); double blockade eliminates
      >98% of HRV
    notes: observed IHR range 57-126 bpm
  quantitative_parameters:
  - name: IHR_intercept
    value: 118.1
    units: bpm
  - name: IHR_age_slope
    value: -0.57
    units: bpm/year
  timescale: chronic (age); beat-by-beat (modulation)
  condition_dependence:
    healthy: as above
  evidence_level: E4
  source_claims:
  - EVD-AUTN-007
  uncertainty: blockade doses vary across labs
  contradiction_level: none
  validation: simulated double blockade collapses HRV >98% and yields HR = IHR(age)
- id: REL-ORTHOSTATIC-TIMECOURSE
  name: Posture -> HR/BP/SV/CO full time course (PROTOCOL-CONDITIONED, MANDATORY)
  variables:
    inputs:
    - posture_transition (supine->stand | supine->tilt | NASA-lean)
    - supine_rest_duration
    - fasting_state
    - time_of_day
    - age
    outputs:
    - delta_HR(t)
    - SBP(t)
    - DBP(t)
    - SV(t)
    - CO(t)
    - SVR(t)
  direction: upright -> venous pooling -> transient BP dip -> baroreflex HR/SVR compensation -> sustained tachycardia with slow upward drift
  functional_form:
    class: multi-phase event kernel (initial transient + early stabilization + sustained creep), parameterized PER PROTOCOL
    equation: 'delta_HR(t) = A_transient * kernel_fast(t) + A_sustained(protocol) * (1 - exp(-(t-t0)/tau_rise)) + drift_rate * t; recovery on
      supine return: fast tau << onset tau, baseline within ~30-60 s with bradycardic overshoot'
    notes: 'MANDATORY per contradiction audit Target 1: the healthy 10-min delta-HR is protocol-dependent, NOT a single Normal(+12,5). Never force
      >95%-below-30-bpm; true 10-min false-positive rate is ~10-33% depending on protocol. Split initial transient (peak 10-30 s) from sustained
      1-10-min response explicitly (review P2 item 9).'
  quantitative_parameters:
  - name: initial_BP_dip
    value: nadir ~10 s, recover by 20-30 s; abnormal if SBP drop >40 or DBP >25 mmHg (initial OH)
    units: mmHg
  - name: initial_HR_peak
    value: rises from ~3 s, peaks ~10-15 s (vagal withdrawal + muscle-pump reflex)
    units: s
  - name: stand10_deltaHR_casual
    distribution:
      type: normal
      mean: 12
      sd: 5
      units: bpm
    note: free-living/short-notice stand; <5% exceed 30 bpm
  - name: stand10_deltaHR_lab
    distribution:
      type: normal
      mean: 25
      sd: 6
      units: bpm
    note: 'Vanderbilt protocol (>=1 h supine, fasting, morning): 23+/-3 @5min, 25+/-3 @10min, 26+/-3 @30min (Plash); Seeley 2025 review: 15 [IQR
      9-20]; NASA lean (passive-muscle-pump-removed): 33% of healthy exceed 30 bpm by 10 min (Lee 2020)'
  - name: tilt10_deltaHR
    distribution:
      type: normal
      mean: 34
      sd: 8
      units: bpm
    note: 'Plash tilt: 27+/-3 @5min, 34+/-3 @10min, 40+/-4 @30min; 60% of controls exceed 30 bpm at 10-min tilt, 80% at 30-min'
  - name: prolonged_stand_drift
    distribution:
      type: uniform
      min: 2
      max: 5
      units: bpm per 10 min
    note: plasma-filtration driven; E1 provisional
  - name: upright_SV_CO_SVR
    value: SV -23% (CI -30..-16), CO -14 to -20%, SVR +~25%, DBP +~8+/-4 mmHg, SBP ~0+/-6 mmHg
  - name: adolescent_tail
    value: 95th percentile stand delta-HR 41-48 bpm; 42% of healthy children exceed 30 bpm on 5-min tilt -> pediatric POTS criterion >=40 bpm
  timescale: seconds (transient) to 30+ min (creep)
  condition_dependence:
    healthy: as above; protocol-conditioned means with honest tails
    pots: 'sustained component rises over 2-5 min and creeps to 30+ min; HUT delta-HR 49+/-4 @5min, 55+/-5 @10min, 62+/-4 @30min; stand 44+/-4
      / 50+/-4; 1-min values overlap controls (103.9 vs 99.2), separation develops minutes 2-10; tilt>stand at every time point (EVD-POTS-005);
      time-of-day: +8-10 bpm AM bias, pediatric positivity 100% AM vs 27.9% evening (EVD-POTS-002)'
    mecfs: HUT HR SMD +0.92+/-0.24; standing delta-HR SMD +0.86+/-0.46; CBF -26% vs -7%; hemodynamic phenotypes 58% normal / 14% delayed OH /
      28% POTS (EVD-MECFS-006)
    heds: POTS-rate 7-49% by criteria/ascertainment - sample, do not hard-code (EVD-EDS-004)
    vasovagal_contrast: SV-fall-first state machine; symptoms ~155 s before measurable change; CBFv leads MAP by ~67 s; cardioinhibition late
      (EVD-POTS-017)
  evidence_level: E3 (healthy reference); E4 (POTS trajectory)
  source_claims:
  - EVD-HLTH-004
  - EVD-AUTN-005
  - EVD-TEMP-003
  - EVD-POTS-001
  - EVD-POTS-005
  - EVD-POTS-002
  - EVD-POTS-012
  - EVD-POTS-018
  - EVD-MECFS-006
  uncertainty: free-living healthy stand distribution essentially unmeasured at scale; orthostatic delta-HR event-to-event reliability unknown
    (provisional CV 15-25%, coverage gap 5)
  contradiction_level: high (this is THE calibration hinge; protocol must be a modeled variable)
  validation: 'fraction exceeding 30 bpm at 10 min: ~2-5% casual stand, ~10-33% aggressive stand/NASA-lean, ~40-60% tilt; 1-min POTS/control overlap;
    5-10-min separation; tilt-down: HR within ~10 bpm of baseline by 2 min'
- id: REL-VENOUS-POOLING-REFILL
  name: Orthostatic venous pooling and transcapillary plasma shift
  variables:
    inputs:
    - posture
    - upright_duration
    outputs:
    - thoracic blood volume
    - plasma volume
    - preload
  direction: upright -> blood shifts below diaphragm; plasma filters to interstitium; both drive preload fall
  functional_form:
    class: two-time-constant volume dynamics
    equation: 'pooling: 0.5-1.0 L, bulk within first 10 s, complete 3-5 min; plasma loss ~10% (~500 mL) by 5 min, 15-20% by 10 min; repo states:
      Vvm (Heldt 2002 venomotor Hill, tau_veno=12 s) + Vsr (van Heusden 2006 stress-relaxation creep, tau_sr=100 s)'
    notes: RAAS engages only after minutes - do NOT attribute first-60-s compensation to RAAS. CO falls ~20%; MSNA ~1.5-2x; plasma NE 181->472
      pg/mL (~2.5x; spillover +80%, clearance -30%).
  quantitative_parameters:
  - name: pooled_volume
    distribution:
      type: uniform
      min: 300
      max: 800
      units: mL
    note: TEMPORAL claim 300-800 mL; AUTONOMIC 0.5-1.0 L
  - name: plasma_loss_5min
    value: -10% (~500 mL)
    units: fraction
  - name: plasma_loss_10min
    value: -15 to -20%
    units: fraction
  timescale: pooling <10 s to 3-5 min; filtration minutes; RAAS minutes-hours
  condition_dependence:
    healthy: as above
    pots_flow_phenotypes: 'thoracic volume change at tilt: control -12+/-3% vs low-flow -25+/-5%, normal-flow -32+/-4%, high-flow -30+/-5%; splanchnic
      pooling differentiates variants (Stewart lab, adolescents, replication LOW - do-not-overtrust)'
    heds: 'venous-pooling mechanism E0-E1: no venous-compliance measurement exists; optional perturbation with explicit ''mechanism untested''
      flag (do-not-hard-code item 10)'
  evidence_level: E4
  source_claims:
  - EVD-AUTN-005
  - EVD-POTS-007
  - EVD-TEMP-003
  - EVD-EDS-003
  uncertainty: 'venous stress-relaxation kinetics quantitatively unknown (E1); Stewart flow phenotypes single-lab (replication: low)'
  contradiction_level: low (healthy arc); high (hEDS mechanism)
  validation: 'active-stand scenario: pooling <10 s, BP dip recovery <30 s, plasma drift -10%/5 min; repo test: pooling >=350 mL at 100 s, analytic
    steady state in [500,1000] mL'
- id: REL-EXERCISE-KINETICS
  name: Exercise HR on/off kinetics, HRmax, and heart-rate recovery
  variables:
    inputs:
    - workload
    - age
    - fitness
    - protocol (position, cool-down)
    outputs:
    - HR(t)
    - HRmax
    - HRR1/HRR2
  direction: 'onset: biphasic rise (vagal fast + sympathetic slow); cessation: bi-exponential decay (fast vagal + slow sympathetic)'
  functional_form:
    class: mono-exponential on-kinetics; bi-exponential off-kinetics; linear HR-workload
    equation: 'on: HR(t) = HR0 + dHR_fast*(1-exp(-t/tau_fast)) + dHR_slow*(1-exp(-t/tau_slow)); off: HR(t) = HR_end - A1*(1-exp(-t/tau_rec_fast))
      - A2*(1-exp(-t/tau_rec_slow)); steady HR ~= resting + (HRmax - resting) * relative_intensity (approx linear 40-100% VO2max); HRmax = 208
      - 0.7*age + N(0, 10.5)'
    notes: SUPERSEDED Fox 220-age equation must be REPLACED in repo population.py (HM=(220-age)/60) by Tanaka (audit defect). HRmax residual is
      irreducible (SD ~10-12 bpm; two healthy 40-y-olds can differ by 40 bpm) - never sample HR zones without residual.
  quantitative_parameters:
