id: conditions.autoimmune
name: Autoimmune Dysautonomia (AIDA)
version: "1.1.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Autoimmune dysautonomia (AIDA) condition definition and its Autoimmune
  Autonomic Neuropathy phenotype with evidence-tiered model representations
  for the Geddes 2022 baroreflex model. Migrated from
  knowledge_base/diseases/autoimmune.yaml (revision 2 adversarial-DOI-review
  re-curation v1.1); all scientific content (descriptions, mechanisms,
  citations, evidence levels/tiers and review annotations) is preserved
  verbatim, without re-grading.
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate vocabulary
  - package: models.baroreflex-geddes-2022
    version: ">=1.0.0 <2.0.0"
    reason: phenotype model representations reference model symbols
contents:
  - autoimmune.yaml
provenance:
  derived_from:
    - source: knowledge_base/diseases/autoimmune.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.1"
      transformation: >
        disease -> condition entity; phenotypes -> condition entities
        (condition_type: phenotype, parent AIDA); parameters_perturbed ->
        model_representations.parameter_perturbations (empty);
        unverified_parameters -> model_representations.unverified_parameter_perturbations
        (consumer-inert per legacy semantics); phenotype association_evidence
        -> entity association_evidence with verbatim citation; per-parameter
        provenance -> evidence with basis machine_proposed and verbatim
        review_status as curation_note. No scientific content was re-graded
        during migration.
