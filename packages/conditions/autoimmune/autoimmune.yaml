ocpe: "0.1"
package: conditions.autoimmune
title: Autoimmune Dysautonomia (AIDA) and autoimmune autonomic neuropathy phenotype
description: >
  Autoimmune Dysautonomia (AIDA) and its Autoimmune Autonomic Neuropathy
  phenotype. Phenotype model representations are model-specific hypotheses
  (with their own evidence) about how the phenotype is encoded in the Geddes
  2022 baroreflex model; clinical/physiological claims are carried by the
  condition entities and their association evidence. Every parameter
  perturbation in this package is an unverified machine-proposed hypothesis
  and remains consumer-inert (legacy unverified_parameters semantics) pending
  human review.
provenance:
  derived_from:
    - source: knowledge_base/diseases/autoimmune.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.1"
      transformation: >
        Revision 2 (independent-review adversarial DOI review) v1.1 migrated
        without re-grading; file-header curation rationale preserved verbatim
        in curation_notes.
  review_manifest: packages/conditions/autoimmune/autoimmune.yaml.review.yaml
curation_notes:
  - "SOURCE HEADER (verbatim, autoimmune.yaml v1.1): PROPOSED CORRECTION (not yet merged) — adversarial DOI review Revision 2 (independent-review WARNING 2): tier-D magnitudes moved OUT of canonical parameters_perturbed into unverified_parameters; the real citation (Vernino 2000) now lives in a phenotype-level association_evidence block so no unverified magnitude carries a parameter-level DOI implying source support. PerturbationManager (simulation/perturbations.py:39,71) reads ONLY parameters_perturbed, so the engine safely ignores these blocks — unverified values will NOT be applied until human review promotes them."
  - "SOURCE HEADER (verbatim): OLD citation 10.1002/ana.10659 was a WRONG PAPER: it resolves (doi.org, CrossRef, Europe PMC) to Ginsberg et al. 2003, \"Stilbazulenyl nitrone, a novel antioxidant, is highly neuroprotective in focal ischemia,\" Ann Neurol (PMID 12953265) — unrelated to autonomic autoimmunity."
  - "SOURCE HEADER (verbatim): REPLACEMENT citation: Vernino S, Low PA, Fealey RD, Stewart JD, Farrugia G, Lennon VA. \"Autoantibodies to ganglionic acetylcholine receptors in autoimmune autonomic neuropathies.\" N Engl J Med 2000;343:847-855. DOI 10.1056/NEJM200009213431204 (PMID 10995864 — verified via Europe PMC). Vernino 2000 supports the MECHANISM (ganglionic nicotinic AChR autoantibodies cause autoimmune autonomic failure) but contains NO baroreflex gain numbers. Sjogren's-associated autoimmune autonomic ganglionopathy is additionally supported by PMID 19097826 (Auton Neurosci 2009)."
  - "SOURCE HEADER (verbatim): MAGNITUDES: kR/kH 25 -> 15 (a 40% gain reduction) has NO quantitative source. Retained ONLY as explicitly-labeled machine-proposed modeling assumptions (evidence_tier D, UNRESOLVED — requires human review)."
