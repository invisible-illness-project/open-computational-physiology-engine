ocpe: "0.1"
package: conditions.poor-sleep
title: Poor Sleep / Sleep Deprivation and acute sleep deprivation phenotype
description: >
  Poor Sleep / Sleep Deprivation and its acute sleep deprivation phenotype.
  The phenotype model representation is a model-specific hypothesis (with its
  own evidence) about how acute sleep deprivation is encoded in the Geddes 2022
  baroreflex model; clinical/physiological claims are carried by the condition
  entities and their association evidence.
provenance:
  derived_from:
    - source: knowledge_base/diseases/poor_sleep.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.1"
      transformation: >
        v1.1 migrated without re-grading; file-header curation rationale
        preserved verbatim in curation_notes.
  review_manifest: packages/conditions/poor-sleep/poor-sleep.yaml.review.yaml
curation_notes:
  - 'SOURCE HEADER (verbatim, poor_sleep.yaml v1.1): PROPOSED CORRECTION (not yet merged) — adversarial DOI review Revision 2 (independent-review WARNING 2): the tier-D kH magnitude moved OUT of canonical parameters_perturbed into unverified_parameters; the real citation (Zhong 2005) now lives in a phenotype-level association_evidence block so no unverified magnitude carries a parameter-level DOI implying source support. PerturbationManager (simulation/perturbations.py:39,71) reads ONLY parameters_perturbed, so the engine safely ignores these blocks.'
  - 'SOURCE HEADER (verbatim): OLD citation 10.5665/sleep.2894 was a WRONG PAPER: it resolves (doi.org, CrossRef, Europe PMC) to Chang et al. 2013, "Direct effects of light on alertness, vigilance, and the waking EEG in humans depend on prior light history," SLEEP 36(8) (PMID 23904684) — unrelated to sleep-deprivation autonomic effects.'
  - 'SOURCE HEADER (verbatim): REPLACEMENT citation: Zhong X, Hilton HJ, Gates GJ, Jelic S, Stern Y, Bartels MN, Demeersman RE, Basner RC. "Increased sympathetic and decreased parasympathetic cardiovascular modulation in normal humans with acute sleep deprivation." J Appl Physiol 2005;98(6):2024-32. DOI 10.1152/japplphysiol.00620.2004 (PMID 15718408 — abstract accessed): 36-h total sleep deprivation, n=18 healthy subjects; increased sympathetic, decreased parasympathetic cardiovascular modulation, and DECREASED baroreflex sensitivity (BRS) at 24 h of deprivation.'
  - 'SOURCE HEADER (verbatim): PARAMETER MISUSE FIXES: * REMOVED Hm 0.3 -> 0.8 bps. Hm is the model''s heart-rate SATURATION FLOOR (0.3 bps = 18 bpm, a profound-bradycardia/vagal floor in the Geddes model), NOT resting HR. Raising the floor to 0.8 bps (48 bpm) does not produce "elevated resting heart rate" — the resting operating point (~1 bps) sits above the floor either way — and 48 bpm is bradycardic, the OPPOSITE of the claimed sympathetic-elevation mechanism. Zhong 2005 measured HRV/BPV/BRS, not resting-HR elevation; no quantitative source for a resting-HR shift was found. UNRESOLVED GAP: if an elevated resting HR is desired, it must be encoded by shifting the HR Hill curve (e.g. lowering p2H or raising HM/Hm jointly) — parameter mapping and magnitude require human review.'
  - 'SOURCE HEADER (verbatim): * REMOVED kE 7.0 -> 5.0. kE is the Hill coefficient for end-diastolic ELASTANCE (cardiac contractility) control — a SYMPATHETIC effector in the Geddes model (section 2.4-2.6) — not "parasympathetic/vagal modulation" as the old mechanism text claimed. UNRESOLVED GAP: no model parameter directly encodes vagal withdrawal of contractility; the vagal limb acts on HR.'
  - 'SOURCE HEADER (verbatim): * kH reduction retained as the directionally-correct encoding of the verified BRS decrease (shallower HR-per-mmHg baroreflex curve), but moved to unverified_parameters: the magnitude (25 -> 20) is a MACHINE-PROPOSED assumption (tier D); only the DIRECTION is supported (Zhong 2005, tier B).'
references:
  - id: doi:10.1152/japplphysiol.00620.2004
    doi: 10.1152/japplphysiol.00620.2004
    pmid: "15718408"
    citation: "Zhong et al., J Appl Physiol 2005;98:2024-32 (36-h total sleep deprivation, n=18; decreased spontaneous BRS; increased sympathetic / decreased parasympathetic modulation)"
    study_type: experimental_human
entities:
  - id: ocpe:conditions.poor-sleep/poor-sleep
    kind: condition
    label: Poor Sleep / Sleep Deprivation
    aliases:
      - {value: poor_sleep, type: legacy-id, scope: legacy-kb}
    abbreviation: SLEEP
    condition_type: physiological_state
    description: "Physiological perturbations resulting from acute or chronic sleep restriction, elevating resting sympathetic tone and blunting parasympathetic modulation."
    since: "1.1.0"
  - id: ocpe:conditions.poor-sleep/sleep-deprivation
    kind: condition
    label: Acute Sleep Deprivation
    aliases:
      - {value: sleep_deprivation, type: legacy-id, scope: legacy-kb}
    condition_type: phenotype
    parent: ocpe:conditions.poor-sleep/poor-sleep
    description: "Restricted sleep leading to elevated resting heart rate and reduced heart rate variability (vagal withdrawal)."
    association_evidence:
      - supports: [association]
        references: [doi:10.1152/japplphysiol.00620.2004, pmid:15718408]
        citation: "Zhong et al., J Appl Physiol 2005;98:2024-32 (36-h total sleep deprivation, n=18; decreased spontaneous BRS; increased sympathetic / decreased parasympathetic modulation)"
        evidence_tier: "B"
        notes: "Direction-level support ONLY: acute sleep deprivation increases sympathetic and decreases parasympathetic cardiovascular modulation and decreases baroreflex sensitivity. No gain magnitudes reported."
    model_representations:
      - model: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022
        parameter_perturbations: []
        unverified_parameter_perturbations:
          - parameter: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022#kH
            baseline_value: 25.0
            perturbed_value: 20.0
            unit: "1"
            mechanism: "Shallower heart-rate baroreflex Hill curve encoding the decreased baroreflex sensitivity observed after acute sleep deprivation (Zhong 2005). DIRECTION supported; MAGNITUDE is a machine-proposed assumption."
            evidence:
              - supports: [direction]
                basis: machine_proposed
                evidence_level: "Level 4"
                evidence_tier: "D"
                notes: "MACHINE-PROPOSED hypothesis. Direction supported by phenotype-level association_evidence (decreased BRS); MAGNITUDE has no source. REQUIRES HUMAN REVIEW before promotion to parameters_perturbed. Deliberately NO parameter-level DOI."
            curation_status: unverified
            curation_note: "UNRESOLVED - magnitude 25->20 has no supporting source; direction (reduced BRS) supported by Zhong 2005; requires human review"
    unresolved_gaps:
      - "Elevated resting heart rate after sleep deprivation [Hm 0.3 -> 0.8 bps] — Hm is the HR saturation floor (18 bpm), not resting HR; 0.8 bps = 48 bpm is bradycardic and contradicts the claimed mechanism. No quantitative resting-HR source found. Requires: parameter mapping (p2H/HM/Hm shift) + magnitude; human review"
      - "Vagal withdrawal / blunted parasympathetic modulation of cardiac function [kE 7.0 -> 5.0] — kE is sympathetic contractility (end-diastolic elastance) control, not parasympathetic; vagal withdrawal acts on HR control (kH/tauH) in this model. Requires: human review"
    since: "1.1.0"
