id: conditions.poor-sleep
name: Poor Sleep / Sleep Deprivation
version: "1.1.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Poor Sleep / Sleep Deprivation condition definition and its acute sleep
  deprivation phenotype with an evidence-tiered model representation for the
  Geddes 2022 baroreflex model. Migrated from
  knowledge_base/diseases/poor_sleep.yaml (v1.1); all scientific content
  (descriptions, mechanism text, citations, evidence levels/tiers, review
  statuses, and file-header correction comments) is preserved verbatim.
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate vocabulary
  - package: models.baroreflex-geddes-2022
    version: ">=1.0.0 <2.0.0"
    reason: phenotype model representation references model symbols
contents:
  - poor-sleep.yaml
provenance:
  derived_from:
    - source: knowledge_base/diseases/poor_sleep.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.1"
      transformation: >
        disease -> condition entity; phenotypes -> condition entities
        (condition_type: phenotype, parent poor-sleep); parameters_perturbed ->
        model_representations.parameter_perturbations (empty);
        unverified_parameters -> model_representations.unverified_parameter_perturbations
        (consumer-inert per legacy semantics); unresolved_gaps -> condition
        unresolved_gaps strings; association_evidence -> entity
        association_evidence with verbatim citation; per-parameter provenance ->
        evidence objects; file-header correction comments -> document
        curation_notes verbatim. No scientific content was re-graded during
        migration.
