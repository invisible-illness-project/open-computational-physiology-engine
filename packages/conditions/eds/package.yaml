id: conditions.eds
name: Hypermobile Ehlers-Danlos Syndrome (hEDS)
version: "1.2.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Hypermobile Ehlers-Danlos Syndrome (hEDS) condition definition and its
  venous-pooling phenotype specification with an evidence-tiered model
  representation for the Geddes 2022 baroreflex model. Migrated from
  knowledge_base/diseases/eds.yaml (cycle-3 v1.2); all scientific content
  (descriptions, mechanisms, citations, evidence levels/tiers, review_status
  strings, and file-header correction rationale) is preserved verbatim and was
  not re-graded during migration.
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate vocabulary
  - package: models.baroreflex-geddes-2022
    version: ">=1.0.0 <2.0.0"
    reason: phenotype model representations reference model symbols
contents:
  - eds.yaml
provenance:
  derived_from:
    - source: knowledge_base/diseases/eds.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.2"
      transformation: >
        disease -> condition entity; phenotypes -> condition entities
        (condition_type: phenotype, parent hEDS); parameters_perturbed ->
        model_representations.parameter_perturbations (empty in legacy source);
        unverified_parameters -> model_representations.unverified_parameter_perturbations
        (consumer-inert per legacy semantics); per-parameter provenance blocks
        -> evidence objects (basis: machine_proposed for machine-proposed
        hypotheses with deliberately no parameter-level DOI). No scientific
        content was re-graded during migration.
