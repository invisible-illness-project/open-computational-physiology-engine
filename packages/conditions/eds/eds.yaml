ocpe: "0.1"
package: conditions.eds
title: Hypermobile Ehlers-Danlos Syndrome and venous-pooling phenotype
description: >
  Hypermobile Ehlers-Danlos Syndrome (hEDS) and its vascular-laxity
  venous-pooling phenotype. The phenotype model representation is a
  model-specific hypothesis (with its own evidence) about how the phenotype is
  encoded in the Geddes 2022 baroreflex model; clinical/physiological claims
  are carried by the condition entities and their association evidence.
  Migrated from knowledge_base/diseases/eds.yaml without re-grading; all
  scientific content is preserved verbatim.
provenance:
  derived_from:
    - source: knowledge_base/diseases/eds.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.2"
      transformation: >
        Cycle-3 v1.2 migrated without re-grading; file-header curation
        rationale (wrong-paper DOI correction, magnitude caveat, cycle-3 VMvl
        rescale repair) preserved verbatim in curation_notes.
  review_manifest: packages/conditions/eds/eds.yaml.review.yaml
curation_notes:
  - "SOURCE HEADER (verbatim, eds.yaml v1.2): PROPOSED CORRECTION (not yet merged) — adversarial DOI review OLD citation 10.1016/j.amjmed.2006.10.015 was a WRONG PAPER: it resolves (doi.org, CrossRef, Europe PMC) to \"Difficult-to-control asthma in adults,\" Am J Med 2007 (PMID 17765041) — unrelated to Ehlers-Danlos or vasculature."
  - "SOURCE HEADER (verbatim): REPLACEMENT citation: Gazit Y, Nahir AM, Grahame R, Jacob G. \"Dysautonomia in the joint hypermobility syndrome.\" Am J Med 2003;115(1):33-40. DOI 10.1016/S0002-9343(03)00235-3 (PMID 12867232 — verified via Europe PMC, abstract accessed). Gazit 2003 found orthostatic intolerance/OH/POTS in 78% (21/27) of joint-hypermobility patients vs 10% (2/21) of controls, with alpha- and beta-adrenergic HYPERresponsiveness — it supports the hEDS<->dysautonomia association but contains NO vascular compliance (Cal) or venous capacity (VMvl) measurements."
  - "SOURCE HEADER (verbatim): MAGNITUDES: Cal 0.3726 -> 0.65 (+75%) and VMvl x1.41 have NO quantitative source. Moved to a clearly-labeled unverified block (evidence_tier D — machine-proposed hypotheses, require human review)."
  - "SOURCE HEADER (verbatim): CYCLE-3 REVISION: the repo's Cycle-2 venous rescale changed the canonical VMvl nominal from 195.075 mL (Geddes 2022 scale) to 700.0 mL (orthostatic pooling scale, see equations/mathematical_models.yaml). The stale 195.075 -> 275.0 entry below is re-expressed on the new scale at the SAME ratio (275.0/195.075 = x1.41): 700.0 x 1.41 = 987.0 mL. The value remains tier-D unverified; only its scale reference was repaired."
references:
  - id: doi:10.1016/S0002-9343(03)00235-3
    doi: 10.1016/S0002-9343(03)00235-3
    pmid: "12867232"
    title: "Dysautonomia in the joint hypermobility syndrome"
    citation: "Gazit et al., Am J Med 2003;115(1):33-40 (48 JHS patients, 30 controls; orthostatic intolerance 78% vs 10%; adrenergic hyperresponsiveness)"
    study_type: observational_human
  - id: doi:10.1016/j.amjmed.2006.10.015
    doi: 10.1016/j.amjmed.2006.10.015
    pmid: "17765041"
    citation: "\"Difficult-to-control asthma in adults,\" Am J Med 2007 (PMID 17765041)"
    study_type: other
    verification:
      status: disputed
      notes: "SOURCE HEADER (verbatim): OLD citation 10.1016/j.amjmed.2006.10.015 was a WRONG PAPER: it resolves (doi.org, CrossRef, Europe PMC) to \"Difficult-to-control asthma in adults,\" Am J Med 2007 (PMID 17765041) — unrelated to Ehlers-Danlos or vasculature. Registered only to document the correction; it must not be cited as support for any hEDS content."
entities:
  - id: ocpe:conditions.eds/eds
    kind: condition
    label: Hypermobile Ehlers-Danlos Syndrome
    aliases:
      - {value: eds, type: legacy-id, scope: legacy-kb}
    abbreviation: hEDS
    condition_type: disease
    description: "A heritable connective tissue disorder characterized by joint hypermobility, skin hyperextensibility, and tissue fragility, often associated with severe orthostatic intolerance and venous pooling."
    since: "1.2.0"
  - id: ocpe:conditions.eds/heds-venous-pooling
    kind: condition
    label: hEDS Vascular Laxity
    aliases:
      - {value: heds_venous_pooling, type: legacy-id, scope: legacy-kb}
    condition_type: phenotype
    parent: ocpe:conditions.eds/eds
    description: "Severe vascular compliance elevation leading to lower limb venous pooling and blunted venous return."
    association_evidence:
      - supports: [association]
        references: [doi:10.1016/S0002-9343(03)00235-3, pmid:12867232]
        citation: "Gazit et al., Am J Med 2003;115(1):33-40 (48 JHS patients, 30 controls; orthostatic intolerance 78% vs 10%; adrenergic hyperresponsiveness)"
        evidence_tier: "B"
        notes: "Qualitative support for hEDS -> orthostatic intolerance/dysautonomia. Does NOT support any specific compliance or capacity magnitude."
    model_representations:
      - model: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022
        notes: "MACHINE-PROPOSED hypotheses. No supporting source found for either magnitude; retained for modeling exploration only. REQUIRE HUMAN REVIEW before promotion to parameters_perturbed."
        parameter_perturbations: []
        unverified_parameter_perturbations:
          - parameter: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022#Cal
            baseline_value: 0.3726
            perturbed_value: 0.65
            unit: mL/mm[Hg]
            mechanism: "Increased distensibility of the lower body arterial-venous compartment due to collagen laxity (hypothesized; no quantitative human hEDS compliance data found)."
            evidence:
              - supports: [magnitude]
                basis: machine_proposed
                evidence_level: "Level 4"
                evidence_tier: "D"
                notes: "NO parameter-level DOI: Gazit 2003 (phenotype-level association_evidence) contains no compliance values; attaching its DOI here would falsely imply source support for this magnitude."
            curation_status: unverified
            curation_note: "UNRESOLVED - no supporting source for magnitude +75%; requires human review"
          - parameter: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022#VMvl
            baseline_value: 700.0
            perturbed_value: 987.0
            unit: mL
            mechanism: "Pathological expansion of lower body venous capacity limits (x1.41 of canonical), accelerating pooling upon standing (hypothesized; no quantitative human hEDS venous-capacity data found)."
            evidence:
              - supports: [magnitude]
                basis: machine_proposed
                evidence_level: "Level 4"
                evidence_tier: "D"
                notes: "NO parameter-level DOI: Gazit 2003 (phenotype-level association_evidence) contains no venous-capacity values; attaching its DOI here would falsely imply source support for this magnitude."
            curation_status: unverified
            curation_note: "UNRESOLVED - no supporting source for magnitude +41%; requires human review. CYCLE-3 rescale repair: canonical VMvl nominal is now 700.0 mL (Cycle-2 venous rescale; was 195.075 mL on the Geddes 2022 scale). Original hypothesis was 195.075 -> 275.0 = x1.41; preserved as ratio: 700.0 x 1.41 = 987.0 mL. Still tier-D UNVERIFIED — only the scale reference was repaired, no new evidence implied."
    since: "1.2.0"
