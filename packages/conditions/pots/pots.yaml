ocpe: "0.1"
package: conditions.pots
title: POTS syndrome and phenotypes
description: >
  Postural Orthostatic Tachycardia Syndrome and its three phenotypes. Phenotype
  model representations are model-specific hypotheses (with their own
  evidence) about how each phenotype is encoded in the Geddes 2022 baroreflex
  model; clinical/physiological claims are carried by the condition entities
  and their association evidence.
provenance:
  derived_from:
    - source: knowledge_base/diseases/pots.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.5"
      transformation: >
        Cycle-3 re-curation v1.5 migrated without re-grading; file-header
        curation rationale preserved verbatim in curation_notes.
  review_manifest: packages/conditions/pots/pots.yaml.review.yaml
curation_notes:
  - "SOURCE HEADER (verbatim, pots.yaml v1.5): PROPOSED CORRECTION (not yet merged) — cycle-3 POTS re-curation (v1.5). Builds on cycle-2 v1.4 (Geddes 2022 corrections + tilt-onset annotations). New evidence base: ocpe_pots_recuration_evidence.md (records NP-01..NP-07, HP-01..HP-04, HY-01), with cycle-2 venomotor/stress-relaxation parameters (dV_veno_max=250 mL, kV=8, p2V=87.5 mmHg, tau_veno=12 s, VMvl=700 mL, mvl=0.035 1/mmHg — all registered in the Geddes 2022 model specification)."
  - "SOURCE HEADER (verbatim): COMPOSABILITY (Angeli 2024, Sci Rep 14, PMC10761725, PMID 38168762, n=378; tier A): 41.7% of POTS patients carry TWO phenotypes and 11.4% all THREE; no symptom differences between phenotypes. These phenotype blocks are therefore COMPOSABLE, not mutually exclusive — combining them via multiplicative composition (e.g. 'neuropathic_pots * hypovolemic_pots') reflects the clinical reality."
  - "SOURCE HEADER (verbatim): CROSS-PHENOTYPE GUARD (Stewart 2002 PMID 12010910; Freeman 2002 PMID 12133874; tier B): the pooling defect in POTS is one of reflex vasoconstrictor/venomotor TONE, NOT passive venous compliance (compliance is unchanged [Stewart] or even LOWER [Freeman]). Therefore mvl and VMvl must NOT be perturbed upward in ANY POTS phenotype — do so only via the venomotor capacity parameter dV_veno_max (neuropathic) below."
