id: conditions.mecfs
name: Myalgic Encephalomyelitis / Chronic Fatigue Syndrome (ME/CFS)
version: "1.1.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  ME/CFS syndrome definition and its metabolic-dysfunction phenotype
  specification with evidence-tiered model representations for the Geddes
  2022 baroreflex model. Migrated from knowledge_base/diseases/mecfs.yaml
  (v1.1); all scientific content (descriptions, mechanisms, citations,
  evidence levels/tiers, review-status annotations) was preserved verbatim
  and no scientific content was re-graded. The source file-header
  DOI-correction and re-derived-magnitude rationale is preserved verbatim
  in the document curation_notes.
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate vocabulary
  - package: models.baroreflex-geddes-2022
    version: ">=1.0.0 <2.0.0"
    reason: condition model representations reference model symbols
contents:
  - mecfs.yaml
provenance:
  derived_from:
    - source: knowledge_base/diseases/mecfs.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.1"
      transformation: >
        disease -> condition entity; phenotypes -> condition entities
        (condition_type: phenotype, parent ME/CFS); parameters_perturbed ->
        model_representations.parameter_perturbations; unverified_parameters
        -> model_representations.unverified_parameter_perturbations
        (consumer-inert per legacy semantics); per-parameter provenance ->
        evidence with verbatim citations. No scientific content was re-graded
        during migration; file-header correction rationale preserved verbatim
        in document curation_notes.
