ocpe: "0.1"
package: conditions.mecfs
title: ME/CFS syndrome and metabolic-dysfunction phenotype
description: >
  Myalgic Encephalomyelitis / Chronic Fatigue Syndrome and its
  metabolic-dysfunction phenotype. The phenotype model representation is a
  model-specific hypothesis (with its own evidence) about how the phenotype
  is encoded in the Geddes 2022 baroreflex model; clinical/physiological
  claims are carried by the condition entities.
provenance:
  derived_from:
    - source: knowledge_base/diseases/mecfs.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.1"
      transformation: >
        Migrated without re-grading; file-header correction rationale
        preserved verbatim in curation_notes.
  review_manifest: packages/conditions/mecfs/mecfs.yaml.review.yaml
curation_notes:
  - 'SOURCE HEADER (verbatim, mecfs.yaml v1.1): PROPOSED CORRECTION (not yet merged) — adversarial DOI review OLD citation 10.1186/s12967-020-02575-x is FABRICATED: invalid-checksum DOI (doi.org HTTP 404; absent from CrossRef/Europe PMC). The nearest REAL DOI, 10.1186/s12967-020-02575-7, is the *Correction* notice to Holden et al. 2020, "A systematic review of mitochondrial abnormalities in ME/CFS/SEID" (J Transl Med 18:407; parent article 10.1186/s12967-020-02452-3, PMID 32727475) — a mitochondrial review containing NO heart-rate ceilings and NO autonomic time constants. So even the "intended" source cannot support any perturbation here.'
  - 'SOURCE HEADER (verbatim): REPLACEMENT citation for chronotropic impairment (real, found by targeted search, full text accessed): Davenport TE, VanNess JM, Stevens SR, et al. "Chronotropic Intolerance: An Overlooked Determinant of Symptoms and Activity Limitation in ME/CFS?" Front Pediatr 2019;7:82. DOI 10.3389/fped.2019.00082. Reported values (Table 4, two-day CPET, ME/CFS n=47 vs matched controls n=35): at ventilatory anaerobic threshold, ME/CFS achieved 92.4% of predicted HR on CPET-1 (controls 95.0%, ns) and 90.6% on CPET-2 (controls 101.1%, p<0.01) — a ~10 bpm post-exertional chronotropic decrement.'
  - 'SOURCE HEADER (verbatim): RE-DERIVED MAGNITUDE (HM): apply the verified ~91-92% ceiling ratio to the repo nominal: 3.3333 x 0.92 = 3.07 bps (~184 bpm). CAVEAT (metric mismatch): the source metric is % of age-predicted HR achieved at VAT during serial CPET — NOT a measured absolute HRmax — so 3.07 bps is an indirect, semi-quantitative estimate (evidence_tier B, marked NEEDS REVIEW). The old value 2.6 bps (156 bpm, -22%) is roughly 3x larger than any effect in the accessed evidence and is replaced.'
  - 'SOURCE HEADER (verbatim): tauH and taur doublings: NO supporting source found anywhere; moved to unverified block (evidence_tier D) pending human review.'
  - 'SOURCE INLINE COMMENT (verbatim, unverified_parameters block): MACHINE-PROPOSED hypotheses. No supporting source found for either time-constant change; require human review.'
references:
  - id: doi:10.3389/fped.2019.00082
    doi: 10.3389/fped.2019.00082
    citation: "Davenport et al., Front Pediatr 2019;7:82, Table 4 (ME/CFS n=47 vs controls n=35; % predicted HR at VAT 92.4% CPET-1, 90.6% CPET-2 vs 95.0%/101.1% controls; repo nominal x0.92)"
    study_type: experimental_human
entities:
  - id: ocpe:conditions.mecfs/mecfs
    kind: condition
    label: Myalgic Encephalomyelitis / Chronic Fatigue Syndrome
    aliases:
      - {value: mecfs, type: legacy-id, scope: legacy-kb}
    abbreviation: ME/CFS
    condition_type: syndrome
    description: "A complex multi-system illness characterized by profound fatigue, post-exertional malaise (PEM), unrefreshing sleep, cognitive impairment, and orthostatic intolerance."
    since: "1.1.0"
  - id: ocpe:conditions.mecfs/mecfs-metabolic-dysfunction
    kind: condition
    label: ME/CFS Metabolic Blunting
    aliases:
      - {value: mecfs_metabolic_dysfunction, type: legacy-id, scope: legacy-kb}
    condition_type: phenotype
    parent: ocpe:conditions.mecfs/mecfs
    description: "Severe depletion of metabolic reserve capacity, impaired autonomic response time constants, and delayed recovery kinetics."
    model_representations:
      - model: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022
        parameter_perturbations:
          - parameter: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022#HM
            baseline_value: 3.3333
            perturbed_value: 3.07
            unit: /s
            mechanism: "Blunted maximum chronotropic response (chronotropic incompetence / chronotropic intolerance) limiting heart rate acceleration; effect most pronounced in the post-exertional state (2-day CPET paradigm)."
            evidence:
              - supports: [magnitude]
                references: [doi:10.3389/fped.2019.00082]
                citation: "Davenport et al., Front Pediatr 2019;7:82, Table 4 (ME/CFS n=47 vs controls n=35; % predicted HR at VAT 92.4% CPET-1, 90.6% CPET-2 vs 95.0%/101.1% controls; repo nominal x0.92)"
                evidence_level: "Level 2"
                evidence_tier: "B"
            curation_status: partially_verified
            curation_note: "NEEDS REVIEW - source metric is % of predicted HR at ventilatory anaerobic threshold (serial CPET), not absolute HRmax; applied proportionally to model ceiling HM"
        unverified_parameter_perturbations:
          - parameter: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022#tauH
            baseline_value: 6.25
            perturbed_value: 12.0
            unit: s
            mechanism: "Slower autonomic heart rate adjustment rate due to parasympathetic/sympathetic sluggishness (hypothesized; no quantitative ME/CFS baroreflex time-constant data found)."
            evidence:
              - supports: [direction]
                basis: machine_proposed
                evidence_level: "Level 4"
                evidence_tier: "D"
            curation_status: unverified
            curation_note: "UNRESOLVED - no supporting source found; requires human review"
          - parameter: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022#taur
            baseline_value: 12.5
            perturbed_value: 25.0
            unit: s
            mechanism: "Delayed peripheral vasoconstriction response to posture changes (hypothesized; no quantitative ME/CFS vasoconstriction time-constant data found)."
            evidence:
              - supports: [direction]
                basis: machine_proposed
                evidence_level: "Level 4"
                evidence_tier: "D"
            curation_status: unverified
            curation_note: "UNRESOLVED - no supporting source found; requires human review"
    since: "1.1.0"
