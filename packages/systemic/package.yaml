id: systemic
name: Systemic Physiology
version: "1.0.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Whole-body systemic latent constructs (hydration state, inflammatory burden,
  metabolic reserve, hormonal state) and their cross-domain relationships.
  Migrated from the pre-0.1 knowledge base
  (knowledge_base/physiology/latent_states.yaml,
  knowledge_base/ontology/relationships.yaml).
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate vocabulary
  - package: autonomic
    version: ">=1.0.0 <2.0.0"
    reason: sympathetic tone is an object of one relationship
  - package: cardiovascular
    version: ">=1.0.0 <2.0.0"
    reason: total systemic blood volume is an object of one relationship
  - package: populations
    version: ">=1.0.0 <2.0.0"
    reason: relationship applicable-context population descriptors
contents:
  - latent.yaml
  - relationships.yaml
provenance:
  derived_from:
    - source: knowledge_base/physiology/latent_states.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        latent_variables[] (category 'physiology') -> latent_construct
        entities with normalized scale.
    - source: knowledge_base/ontology/relationships.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "3.2"
      transformation: >
        semantic_relationships with systemic subjects -> relationship
        entities (cycle-3 corrections preserved).
