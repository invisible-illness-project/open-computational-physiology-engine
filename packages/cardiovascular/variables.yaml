ocpe: "0.1"
package: cardiovascular
title: Cardiovascular variables
description: >
  Observable (directly or indirectly) cardiovascular quantities of the systemic
  circulation. Compartment volumes, lumped flows and the mean-carotid tracking
  state are Geddes-model abstractions (observability: model_compartment);
  surface-measurable pressures and heart rate are directly or indirectly
  measurable. Reference ranges are engineering plausibility bounds from the
  pre-0.1 knowledge base, NOT population reference intervals.
provenance:
  derived_from:
    - source: knowledge_base/physiology/variables.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        27 legacy entries -> 25 variable entities. 'Hc' (beats/s) and 'HR'
        (beats/min) merged into one variable 'heart-rate' with unit-qualified
        aliases (they denote the same quantity in different units). DFA_a1
        migrated as a derived metric to the autonomic package. Total systemic
        blood volume, vascular compliance, cardiac contractility and
        peripheral resistance from latent_states.yaml were reclassified as
        variables (measurable in principle) — see specification/core/kinds.yaml.
  review_manifest: packages/cardiovascular/variables.yaml.review.yaml
curation_notes:
  - "Legacy file header (verbatim): knowledge_base/physiology/variables.yaml v1.0."
  - "Vvm description references Heldt 2002 (DOI 10.1152/japplphysiol.00241.2001) structure with machine-proposed parameters; Vsr references van Heusden 2006 (DOI 10.1152/ajpheart.01268.2004) with machine-proposed parameters. Both notes carried verbatim from the source descriptions."
references:
  - id: doi:10.1098/rsif.2022.0220
    doi: 10.1098/rsif.2022.0220
    pmid: "36069002"
    title: "Postural orthostatic tachycardia syndrome explained using a baroreflex response model"
    citation: "Geddes JR, Ottesen JT, Mehlsen J, Olufsen MS. J R Soc Interface 2022;19:20220220."
    study_type: in_silico
    summary_document: evidence/references/geddes_2022_baroreflex_pots.md
