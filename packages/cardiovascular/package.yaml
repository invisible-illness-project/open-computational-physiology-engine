id: cardiovascular
name: Cardiovascular Physiology
version: "1.0.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Cardiovascular variables (compartment volumes, pressures, flows, resistances,
  elastances) and the pressure/flow/baroreflex relationships of the systemic
  circulation, migrated from the pre-0.1 knowledge base
  (knowledge_base/physiology/variables.yaml, knowledge_base/ontology/*.yaml).
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate and functional-form vocabulary
  - package: populations
    version: ">=1.0.0 <2.0.0"
    reason: relationship applicable-context population descriptors
contents:
  - variables.yaml
  - relationships.yaml
provenance:
  derived_from:
    - source: knowledge_base/physiology/variables.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        variables[] -> variable entities; valid_range -> context-qualified
        plausibility_bound reference ranges; model symbols preserved as
        legacy-kb aliases; units converted to UCUM codes.
    - source: knowledge_base/ontology/relationships.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "3.2"
      transformation: >
        semantic_relationships whose subject is a cardiovascular variable ->
        relationship entities (cycle-3 corrections preserved; see
        curation_notes).
    - source: knowledge_base/ontology/mechanistic_links.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        mechanistic links whose subject is a cardiovascular variable ->
        relationship entities with functional_form and mathematical
        specification pointers.
