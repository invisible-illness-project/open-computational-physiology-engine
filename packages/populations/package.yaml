id: populations
name: Populations
version: "1.0.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Population descriptors used to qualify the context of reference ranges,
  evidence and measurement performance. These are context descriptors, not
  generative cohort specifications; synthetic cohort generation belongs to
  downstream applications (MOSAIC). Migrated from
  knowledge_base/populations/cohorts.yaml.
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate vocabulary
contents:
  - populations.yaml
provenance:
  derived_from:
    - source: knowledge_base/populations/cohorts.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        cohorts[] -> population entities; clinical_criteria ->
        inclusion_criteria. The legacy 'recreational_men_cohort' and
        'recreational_women_cohort' referenced by mechanistic_links.yaml were
        never registered there and are NOT defined here (see the free-text
        context in packages/autonomic/relationships.yaml).
