id: models.baroreflex-geddes-2022
name: Baroreflex Response Model (Geddes 2022) Specification
version: "1.0.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Declarative specification of the closed-loop baroreflex response and systemic
  hemodynamics model of Geddes, Ottesen, Mehlsen & Olufsen (J R Soc Interface
  2022;19:20220220), including the cycle-2 venous/orthostatic extension
  (venomotor reflex and stress-relaxation creep). This package stores the
  SPECIFICATION ONLY: symbols, equations, assumptions, units, nominal values
  with provenance, and evidence. Numerical execution (solvers, step sizes,
  initialisation, run orchestration) belongs to downstream implementations.
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate and functional-form vocabulary
  - package: cardiovascular
    version: ">=1.0.0 <2.0.0"
    reason: model states and symbols represent cardiovascular variables
  - package: autonomic
    version: ">=1.0.0 <2.0.0"
    reason: heart-rate/RR-derived metric relationships realized by this model
  - package: populations
    version: ">=1.0.0 <2.0.0"
    reason: validation contexts
contents:
  - baroreflex-geddes-2022.yaml
  - relationships.yaml
provenance:
  derived_from:
    - source: knowledge_base/equations/definitions.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        equations[] -> model.equations with structured inputs/parameters/
        outputs; descriptions carried verbatim.
    - source: knowledge_base/equations/mathematical_models.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        models[0].parameters[] -> model.symbols (role: parameter) with
        nominal values, provenance and curation status carried verbatim.
        Legacy per-parameter 'phenotypes' sub-tables are NOT duplicated here:
        phenotype perturbations are maintained, at newer curation cycles, in
        the conditions.* and interventions.medication packages.
    - source: models/baroreflex_model.py
      git_ref: pre-architectural-refactor
      transformation: >
        State symbol set (Vau, Vvu, Val, Vvl, Vlv, pcm, Raup, Ralp, Ed, Hc,
        Vvm, Vsr) and auxiliary flows taken from the Python implementation
        header; that implementation itself migrates to MOSAIC (see
        migration_archive/MIGRATION_NOTES.md).
    - source: BaroreflexPOTSmodel/ (untracked local clone of github.com/msolufse/BaroreflexPOTSmodel @ 871f46f)
      git_ref: pre-architectural-refactor
      transformation: >
        Upstream MATLAB implementation reference preserved in model.source
        (repository, commit, MIT license, citation requirement) per the
        architectural decision to remove the MATLAB clone from OCPE.
