ocpe: "0.1"
package: models.baroreflex-geddes-2022
title: Geddes 2022 closed-loop baroreflex model specification
description: >
  Declarative specification of the closed-loop baroreflex response and systemic
  hemodynamics model (Geddes et al., J R Soc Interface 2022;19:20220220) with
  the cycle-2 venous/orthostatic extension (Heldt 2002 venomotor structure;
  van Heusden 2006 stress-relaxation creep). Symbols carry units and, where
  one exists, the physiological variable they represent. Nominal parameter
  values are specification data with provenance, not solver settings.
  Numerical execution (solver choice, step size, beat-by-beat valve laws,
  initialisation) is deliberately out of scope for OCPE and belongs to
  downstream implementations (MOSAIC).
provenance:
  derived_from:
    - source: knowledge_base/equations/definitions.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: "equations[] -> model.equations (24; ids, LaTeX, I/O declarations and descriptions verbatim)."
    - source: knowledge_base/equations/mathematical_models.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        models[0].parameters[] -> model.symbols with nominal values and
        provenance verbatim. Legacy per-parameter 'phenotypes' sub-tables
        (v1.0) intentionally omitted: they are superseded by the newer-curated
        perturbations in packages/conditions.* and
        packages/interventions/medication (see migration_archive/
        MIGRATION_NOTES.md).
  review_manifest: packages/models/baroreflex-geddes-2022/baroreflex-geddes-2022.yaml.review.yaml
curation_notes:
  - "Pre-0.1 model version lineage: Geddes 2022 base (12-state formulation), extended in cycle 2 with physiological venous pooling, venomotor reflex and stress-relaxation (lower_venous_effective_capacity, venomotor_reflex, venous_stress_relaxation equations; Cvu/VMvl/mvl rescales documented on the respective symbols)."
  - "Valve flow laws (qav, qmv) and the varying-elastance-driven beat-by-beat cardiac mechanics are not part of the equation registry; they live in the upstream implementations (MATLAB clone and pre-0.1 Python model, both migrated out of OCPE). qav/qmv/Elv are declared as auxiliary symbols for cross-reference."
