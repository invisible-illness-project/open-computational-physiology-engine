entities:
  - id: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022
    kind: model
    label: Closed-Loop Baroreflex Response and Systemic Hemodynamics Model
    definition: >
      Lumped five-compartment closed-loop cardiovascular model with sigmoidal
      baroreflex control of heart rate, peripheral resistances and
      end-diastolic elastance, extended with a venomotor reflex and
      stress-relaxation creep for orthostatic pooling (Geddes 2022 base;
      cycle-2 venous extension).
    formalism: ode
    scope: "Systemic cardiovascular hemodynamics and baroreflex regulation during rest and head-up tilt; validated against healthy and POTS cohorts (in silico, Level 4)."
    symbols:
      # ---- states (12 ODE states) ----
      - symbol: Vau
        role: state
        label: Upper arterial blood volume
        unit: mL
        represents: ocpe:cardiovascular/upper-arterial-volume
      - symbol: Vvu
        role: state
        label: Upper venous blood volume
        unit: mL
        represents: ocpe:cardiovascular/upper-venous-volume
      - symbol: Val
        role: state
        label: Lower arterial blood volume
        unit: mL
        represents: ocpe:cardiovascular/lower-arterial-volume
      - symbol: Vvl
        role: state
        label: Lower venous blood volume
        unit: mL
        represents: ocpe:cardiovascular/lower-venous-volume
      - symbol: Vlv
        role: state
        label: Left ventricular blood volume
        unit: mL
        represents: ocpe:cardiovascular/left-ventricular-volume
      - symbol: pcm
        role: state
        label: Mean carotid pressure (first-order tracking state)
        unit: mm[Hg]
        represents: ocpe:cardiovascular/mean-carotid-pressure
      - symbol: Raup
        role: state
        label: Upper peripheral resistance (controlled state)
        unit: mm[Hg].s/mL
        represents: ocpe:cardiovascular/upper-peripheral-resistance
      - symbol: Ralp
        role: state
        label: Lower peripheral resistance (controlled state)
        unit: mm[Hg].s/mL
        represents: ocpe:cardiovascular/lower-peripheral-resistance
      - symbol: Ed
        role: state
        label: End-diastolic left ventricular elastance (controlled state)
        unit: mm[Hg]/mL
        represents: ocpe:cardiovascular/end-diastolic-elastance
      - symbol: Hc
        role: state
        label: Heart rate in beats per second (controlled state)
        unit: /s
        represents: ocpe:cardiovascular/heart-rate
        description: "Same quantity as heart rate; expressed in beats/s inside the model (1 bps = 60 bpm)."
      - symbol: Vvm
        role: state
        label: Venomotor reflex capacity reduction (cycle 2)
        unit: mL
        represents: ocpe:cardiovascular/venomotor-reflex-capacity-reduction
      - symbol: Vsr
        role: state
        label: Venous stress-relaxation creep volume (cycle 2)
        unit: mL
        represents: ocpe:cardiovascular/venous-stress-relaxation-creep-volume
      # ---- auxiliary model quantities ----
      - symbol: pau
        role: auxiliary
        label: Upper arterial pressure
        unit: mm[Hg]
        represents: ocpe:cardiovascular/upper-arterial-pressure
      - symbol: pal
        role: auxiliary
        label: Lower arterial pressure
        unit: mm[Hg]
        represents: ocpe:cardiovascular/lower-arterial-pressure
      - symbol: pvu
        role: auxiliary
        label: Upper venous pressure
        unit: mm[Hg]
        represents: ocpe:cardiovascular/upper-venous-pressure
      - symbol: pvl
        role: auxiliary
        label: Lower venous pressure
        unit: mm[Hg]
        represents: ocpe:cardiovascular/lower-venous-pressure
      - symbol: plv
        role: auxiliary
        label: Left ventricular pressure
        unit: mm[Hg]
        represents: ocpe:cardiovascular/left-ventricular-pressure
      - symbol: pc
        role: auxiliary
        label: Carotid sinus pressure
        unit: mm[Hg]
        represents: ocpe:cardiovascular/carotid-sinus-pressure
      - symbol: Elv
        role: auxiliary
        label: Time-varying left ventricular elastance
        unit: mm[Hg]/mL
      - symbol: qav
        role: auxiliary
        label: Aortic valve blood flow (valve law lives in implementations)
        unit: mL/s
        represents: ocpe:cardiovascular/aortic-valve-flow
      - symbol: qmv
        role: auxiliary
        label: Mitral valve blood flow (valve law lives in implementations)
        unit: mL/s
        represents: ocpe:cardiovascular/mitral-valve-flow
      - symbol: qal
        role: auxiliary
        label: Arterial segment flow
        unit: mL/s
        represents: ocpe:cardiovascular/arterial-segment-flow
      - symbol: qaup
        role: auxiliary
        label: Upper peripheral tissue flow
        unit: mL/s
        represents: ocpe:cardiovascular/upper-peripheral-tissue-flow
      - symbol: qalp
        role: auxiliary
        label: Lower peripheral tissue flow
        unit: mL/s
        represents: ocpe:cardiovascular/lower-peripheral-tissue-flow
      - symbol: qvl
        role: auxiliary
        label: Venous segment flow
        unit: mL/s
        represents: ocpe:cardiovascular/venous-segment-flow
      # ---- control-law outputs (derivatives and Hill targets) ----
      - symbol: dVau
        role: output
        label: d(upper arterial volume)/dt
        unit: mL/s
      - symbol: dVvu
        role: output
        label: d(upper venous volume)/dt
        unit: mL/s
      - symbol: dVal
        role: output
        label: d(lower arterial volume)/dt
        unit: mL/s
      - symbol: dVvl
        role: output
        label: d(lower venous volume)/dt
        unit: mL/s
      - symbol: dVlv
        role: output
        label: d(left ventricular volume)/dt
        unit: mL/s
      - symbol: dpcm
        role: output
        label: "d(mean carotid pressure)/dt (unit: mm[Hg]/s; per-time derivative units are not in the OCPE unit registry)"
      - symbol: dRaup
        role: output
        label: "d(upper peripheral resistance)/dt (unit: mm[Hg].s/mL/s; per-time derivative units are not in the OCPE unit registry)"
      - symbol: dRalp
        role: output
        label: "d(lower peripheral resistance)/dt (unit: mm[Hg].s/mL/s; per-time derivative units are not in the OCPE unit registry)"
      - symbol: dEd
        role: output
        label: "d(end-diastolic elastance)/dt (unit: mm[Hg]/mL/s; per-time derivative units are not in the OCPE unit registry)"
      - symbol: dHc
        role: output
        label: "d(heart rate)/dt (unit: /s/s; per-time derivative units are not in the OCPE unit registry)"
      - symbol: dVvm
        role: output
        label: d(venomotor capacity reduction)/dt
        unit: mL/s
      - symbol: dVsr
        role: output
        label: d(creep volume)/dt
        unit: mL/s
      - symbol: VMvl_eff
        role: output
        label: Effective lower venous capacity (cycle 2)
        unit: mL
      - symbol: Raupf
        role: output
        label: Upper peripheral resistance Hill target
        unit: mm[Hg].s/mL
      - symbol: Ralpf
        role: output
        label: Lower peripheral resistance Hill target
        unit: mm[Hg].s/mL
      - symbol: Edf
        role: output
        label: End-diastolic elastance Hill target
        unit: mm[Hg]/mL
      - symbol: Hf
        role: output
        label: Heart rate Hill target (bps)
        unit: /s
      # ---- time and protocol inputs ----
      - symbol: t
        role: time
        label: Time
        unit: s
      - symbol: theta
        role: input
        label: Tilt angle
        unit: deg
      # ---- constant / geometric parameters (no nominal values recorded in the pre-0.1 parameter table) ----
      - symbol: rho
        role: constant
        label: Blood density
        unit: g/cm3
      - symbol: g
        role: constant
        label: Gravitational acceleration
        unit: cm/s2
      - symbol: hc
        role: constant
        label: Carotid height above heart reference
        unit: cm
      - symbol: conv
        role: constant
        label: Unit conversion factor (hydrostatic term)
        unit: "1"
      - symbol: T
        role: parameter
        label: Cardiac period
        unit: s
      - symbol: Ts
        role: parameter
        label: Ventricular contraction time
        unit: s
      - symbol: Tr
        role: parameter
        label: Ventricular relaxation time
        unit: s
      # ---- hemodynamic parameters (nominal values from mathematical_models.yaml v1.0) ----
      - symbol: Ral
        role: parameter
        label: Upper to lower body arterial resistance
        unit: mm[Hg].s/mL
        nominal_value: 0.0622
      - symbol: Rvl
        role: parameter
        label: Lower to upper body venous resistance
        unit: mm[Hg].s/mL
        nominal_value: 0.0167
      - symbol: Cau
        role: parameter
        label: Upper body arterial compliance
        unit: mL/mm[Hg]
        nominal_value: 1.7213
      - symbol: Cal
        role: parameter
        label: Lower body arterial compliance
        unit: mL/mm[Hg]
        nominal_value: 0.3726
      - symbol: Cvu
        role: parameter
        label: Upper body venous compliance
        unit: mL/mm[Hg]
        nominal_value: 436.36
        represents: ocpe:cardiovascular/vascular-compliance
        evidence:
          - supports: [magnitude]
            references: [doi:10.1152/ajpheart.00086.2004]
            citation: "Cycle 2: rescaled from the Geddes 2022 toy value (70.936 ml/mmHg, Vvu0=195 ml) so the thoracic/upper venous reservoir holds ~1200 ml at the 2.75 mmHg operating point, matching physiological central venous volume and allowing 400-600 ml of orthostatic dependent translocation (MP-01 range) without thoracic collapse. Machine-proposed rescale (value 436.36 preserves the original supine pvu=2.75 mmHg operating point)."
            evidence_tier: "C"
        curation_status: machine_proposed
        curation_note: "Pre-0.1 review_status: machine_proposed_fit."
      - symbol: Es
        role: parameter
        label: Left ventricular maximum systolic elastance
        unit: mm[Hg]/mL
        nominal_value: 3.0
        represents: ocpe:cardiovascular/cardiac-contractility
      - symbol: Vd
        role: parameter
        label: Unstressed left ventricular volume
        unit: mL
        nominal_value: 10.0
      - symbol: kR
        role: parameter
        label: Hill coefficient for sympathetic baroreflex resistance control
        unit: "1"
        nominal_value: 25.0
        description: "Phenotype-specific values (hyperadrenergic POTS etc.) are maintained in packages/conditions.pots, not here."
      - symbol: taur
        role: parameter
        label: Time constant for resistance control
        unit: s
        nominal_value: 12.5
      - symbol: RaupM
        role: parameter
        label: Maximum upper body peripheral resistance
        unit: mm[Hg].s/mL
        nominal_value: 4.5292
        represents: ocpe:cardiovascular/upper-peripheral-resistance
      - symbol: Raupm
        role: parameter
        label: Minimum upper body peripheral resistance
        unit: mm[Hg].s/mL
        nominal_value: 0.3019
        represents: ocpe:cardiovascular/upper-peripheral-resistance
      - symbol: p2Ru
        role: parameter
        label: Half-saturation carotid pressure for upper resistance control
        unit: mm[Hg]
        nominal_value: 89.97
      - symbol: RalpM
        role: parameter
        label: Maximum lower body peripheral resistance
        unit: mm[Hg].s/mL
        nominal_value: 17.88
        represents: ocpe:cardiovascular/lower-peripheral-resistance
        description: "Phenotype-specific values (neuropathic POTS) are maintained in packages/conditions.pots, not here."
      - symbol: Ralpm
        role: parameter
        label: Minimum lower body peripheral resistance
        unit: mm[Hg].s/mL
        nominal_value: 1.192
        represents: ocpe:cardiovascular/lower-peripheral-resistance
      - symbol: p2Ra
        role: parameter
        label: Half-saturation carotid pressure for lower resistance control
        unit: mm[Hg]
        nominal_value: 89.97
      - symbol: kE
        role: parameter
        label: Hill coefficient for parasympathetic elastance control
        unit: "1"
        nominal_value: 7.0
      - symbol: tauE
        role: parameter
        label: Time constant for ventricular elastance control
        unit: s
        nominal_value: 12.5
      - symbol: EdM
        role: parameter
        label: Maximum end-diastolic ventricular elastance
        unit: mm[Hg]/mL
        nominal_value: 0.03125
        represents: ocpe:cardiovascular/end-diastolic-elastance
      - symbol: Edm
        role: parameter
        label: Minimum end-diastolic ventricular elastance
        unit: mm[Hg]/mL
        nominal_value: 0.00025
        represents: ocpe:cardiovascular/end-diastolic-elastance
      - symbol: p2E
        role: parameter
        label: Half-saturation carotid pressure for elastance control
        unit: mm[Hg]
        nominal_value: 76.62
      - symbol: kH
        role: parameter
        label: Hill coefficient for heart rate control
        unit: "1"
        nominal_value: 25.0
        description: "Phenotype-specific values (hyperadrenergic POTS etc.) are maintained in packages/conditions.pots, not here."
      - symbol: tauH
        role: parameter
        label: Time constant for heart rate control
        unit: s
        nominal_value: 6.25
      - symbol: HM
        role: parameter
        label: Maximum heart rate (equivalent to 200 bpm)
        unit: /s
        nominal_value: 3.3333
        represents: ocpe:cardiovascular/heart-rate
      - symbol: Hm
        role: parameter
        label: Minimum heart rate (equivalent to 18 bpm)
        unit: /s
        nominal_value: 0.3
        represents: ocpe:cardiovascular/heart-rate
      - symbol: p2H
        role: parameter
        label: Half-saturation carotid pressure for heart rate control
        unit: mm[Hg]
        nominal_value: 88.66
      - symbol: TotalVol
        role: parameter
        label: Total systemic blood volume
        unit: mL
        nominal_value: 4500.0
        represents: ocpe:cardiovascular/total-systemic-blood-volume
        description: "Phenotype-specific values (hypovolemic POTS etc.) are maintained in packages/conditions.pots, not here."
      - symbol: VMvl
        role: parameter
        label: Maximum lower body venous volume capacity
        unit: mL
        nominal_value: 700.0
        evidence:
          - supports: [magnitude]
            references: [doi:10.1152/ajpheart.00086.2004]
            citation: "Cycle 2: rescaled from the Geddes 2022 value (195.075 ml, ~112 ml pooling headroom) to physiological orthostatic pooling scale. Together with stress-relaxation creep (Vsr, up to several hundred ml of additional slow capacity) this gives ~400-500 ml pooled after 100 s of 60 deg HUT, on track for the 500-1000 ml thorax-to-dependent translocation range documented for longer tilts (MP-01; Stewart 2004 segmental volumes). Machine-proposed fit."
            evidence_tier: "C"
        curation_status: machine_proposed
        curation_note: "Pre-0.1 review_status: machine_proposed_fit."
      - symbol: mvl
        role: parameter
        label: Lower venous pressure-volume compliance parameter
        unit: /mm[Hg]
        nominal_value: 0.035
        evidence:
          - supports: [magnitude]
            references: [doi:10.1152/japplphysiol.00241.2001]
            citation: "Cycle 2: co-fitted with VMvl so that supine pvl=3 mmHg and the fast (elastic) pooling component is self-limiting (~150-250 ml raises pvl to the tilted hydrostatic gate ~19.6 mmHg at 60 deg, height=25 cm), slowing initial pooling so reflexes engage; slow creep (Vsr) then extends pooling over minutes (van Heusden 2006 picture). Machine-proposed fit (MP-01 pooling range; Melchior 1994/Heldt 2002 log-law family)."
            evidence_tier: "C"
        curation_status: machine_proposed
        curation_note: "Pre-0.1 review_status: machine_proposed_fit."
      - symbol: dV_veno_max
        role: parameter
        label: Maximum baroreflex-driven reduction of lower venous capacity
        unit: mL
        nominal_value: 250.0
        evidence:
          - supports: [magnitude]
            references: [doi:10.1152/japplphysiol.00241.2001]
            citation: "Maximum baroreflex-driven reduction of lower venous capacity (venomotor reflex / venoconstriction), Heldt 2002 set-point control structure. Mobilizes pooled venous volume during orthostasis; sized so the healthy reflex operates near saturation at 60 deg HUT (limited reserve, as documented for human venomotor responses). Machine-proposed magnitude within the venomotor mobilization range of the Heldt 2002/CVSim parameter family."
            evidence_tier: "C"
        curation_status: machine_proposed
        curation_note: "Pre-0.1 review_status: machine_proposed."
      - symbol: p2V
        role: parameter
        label: Half-saturation mean carotid pressure of the venomotor reflex Hill curve
        unit: mm[Hg]
        nominal_value: 87.5
        evidence:
          - supports: [magnitude]
            references: [doi:10.1152/japplphysiol.00241.2001]
            citation: "Machine-proposed; placed between the supine (~93 mmHg) and tilted (~90-92 mmHg) operating points so venoconstriction is recruited by the orthostatic carotid pressure drop."
            evidence_tier: "C"
        curation_status: machine_proposed
        curation_note: "Pre-0.1 review_status: machine_proposed."
      - symbol: kV
        role: parameter
        label: Hill (sigmoid) steepness coefficient of the venomotor reflex
        unit: "1"
        nominal_value: 8.0
        evidence:
          - supports: [magnitude]
            references: [doi:10.1152/japplphysiol.00241.2001]
            citation: "Machine-proposed; gentler than the Geddes 2022 arterial controllers (k=25) because venous capacitance vessels show graded, low-gain sympathetic responses, and steep gains destabilize the coupled volume loop."
            evidence_tier: "C"
        curation_status: machine_proposed
        curation_note: "Pre-0.1 review_status: machine_proposed."
      - symbol: tau_veno
        role: parameter
        label: Venomotor reflex first-order time constant
        unit: s
        nominal_value: 12.0
        evidence:
          - supports: [magnitude]
            references: [doi:10.1152/japplphysiol.00241.2001]
            citation: "Evidence supports a range of ~10-30 s (Heldt 2002 / Olufsen 2005 controller family); 12 s chosen at the fast end so volume mobilization engages during the tilt ramp. Machine-proposed within documented range."
            evidence_tier: "C"
        curation_status: machine_proposed
        curation_note: "Pre-0.1 review_status: machine_proposed."
      - symbol: G_sr
        role: parameter
        label: Venous stress-relaxation (creep) gain
        unit: mL/mm[Hg]
        nominal_value: 50.0
        evidence:
          - supports: [magnitude]
            references: [doi:10.1152/ajpheart.01268.2004]
            citation: "Slow capacity increase per mmHg of sustained lower venous pressure above the creep threshold. van Heusden 2006 viscoelastic formulation; gain fitted so total (elastic+creep) pooling reaches ~400-500 ml after 100 s of 60 deg HUT. Model-inferred, not directly measured."
            evidence_tier: "C"
        curation_status: machine_proposed
        curation_note: "Pre-0.1 review_status: machine_proposed."
      - symbol: tau_sr
        role: parameter
        label: Venous stress-relaxation time constant
        unit: s
        nominal_value: 100.0
        evidence:
          - supports: [magnitude]
            references: [doi:10.1152/ajpheart.01268.2004]
            citation: "van Heusden 2006 supports an order of 60-300 s (model-fit to impedance data); 100 s chosen within that range."
            evidence_tier: "C"
        curation_status: machine_proposed
        curation_note: "Pre-0.1 review_status: machine_proposed."
      - symbol: pvl_sr0
        role: parameter
        label: Lower venous pressure threshold for stress-relaxation creep recruitment
        unit: mm[Hg]
        nominal_value: 3.0
        evidence:
          - supports: [magnitude]
            references: [doi:10.1152/ajpheart.01268.2004]
            citation: "Supine lower venous pressure; creep activates only under orthostatic venous load. Machine-proposed."
            evidence_tier: "C"
        curation_status: machine_proposed
        curation_note: "Pre-0.1 review_status: machine_proposed."
      - symbol: tauP
        role: parameter
        label: Carotid baroreceptor pressure tracking time constant
        unit: s
        nominal_value: 2.5
    equations:
      - id: upper_arterial_pressure
        label: Upper Arterial Pressure
        form: algebraic
        expression_latex: 'p_{au}(t) = \frac{V_{au}(t)}{C_{au}}'
        inputs: [Vau]
        parameters: [Cau]
        outputs: [pau]
        description: "Upper body arterial blood pressure derived from volume and compliance."
      - id: lower_arterial_pressure
        label: Lower Arterial Pressure
        form: algebraic
        expression_latex: 'p_{al}(t) = \frac{V_{al}(t)}{C_{al}}'
        inputs: [Val]
        parameters: [Cal]
        outputs: [pal]
        description: "Lower body arterial blood pressure derived from volume and compliance."
      - id: upper_venous_pressure
        label: Upper Venous Pressure
        form: algebraic
        expression_latex: 'p_{vu}(t) = \frac{V_{vu}(t)}{C_{vu}}'
        inputs: [Vvu]
        parameters: [Cvu]
        outputs: [pvu]
        description: "Upper body venous blood pressure derived from volume and compliance."
      - id: lower_venous_pressure
        label: Lower Venous Pressure
        form: algebraic
        expression_latex: 'p_{vl}(t) = \frac{1}{m_{vl}} \ln\left(\frac{V_{Mvl}}{V_{Mvl} - V_{vl}(t)}\right)'
        inputs: [Vvl]
        parameters: [mvl, VMvl]
        outputs: [pvl]
        description: "Logarithmic pressure-volume relationship in the lower venous compartment (sensitive to orthostatic compliance limits)."
      - id: left_ventricular_pressure
        label: Left Ventricular Pressure
        form: algebraic
        expression_latex: 'p_{lv}(t) = E_{lv}(t) V_{lv}(t)'
        inputs: [Vlv, Elv]
        outputs: [plv]
        description: "Time-varying left ventricular pressure."
      - id: varying_ventricular_elastance
        label: Varying Ventricular Elastance
        form: piecewise
        expression_latex: 'E_{lv}(t) = \begin{cases} E_d + \frac{E_s - E_d}{2} \left(1 - \cos\left(\frac{\pi (t \bmod T)}{T_s}\right)\right) & (t \bmod T) \le T_s \\ E_d + \frac{E_s - E_d}{2} \left(\cos\left(\frac{\pi (t \bmod T - T_s)}{T_r}\right) + 1\right) & T_s < (t \bmod T) \le T_s + T_r \\ E_d & (t \bmod T) > T_s + T_r \end{cases}'
        inputs: [t, T, Ts, Tr, Ed, Es]
        outputs: [Elv]
        description: "Double hill-shaped varying elastance function of the ventricle representing systole and diastole."
      - id: carotid_pressure_calculation
        label: Carotid Pressure Calculation
        form: algebraic
        expression_latex: 'p_c(t) = p_{au}(t) - \rho g h_c \frac{\sin(\theta(t))}{conv}'
        inputs: [pau, theta, hc]
        parameters: [rho, g, conv]
        outputs: [pc]
        description: "Pressure at the carotid baroreceptors adjusting for hydrostatic columns during tilt."
      - id: mean_carotid_pressure_tracking
        label: Mean Carotid Pressure Tracking
        form: differential
        expression_latex: '\frac{d p_{cm}(t)}{d t} = \frac{p_c(t) - p_{cm}(t)}{\tau_P}'
        inputs: [pc, pcm]
        parameters: [tauP]
        outputs: [dpcm]
        description: "First-order delay equation tracking mean carotid pressure at baroreceptors."
      - id: upper_peripheral_resistance_control
        label: Upper Peripheral Resistance Control
        form: differential
        expression_latex: '\frac{d R_{aup}(t)}{d t} = \frac{-R_{aup}(t) + R_{aupf}(p_{cm}(t))}{\tau_r}'
        inputs: [Raup, pcm]
        parameters: [taur]
        outputs: [dRaup]
        description: "First order dynamics of autonomic upper body vasoconstriction."
      - id: upper_peripheral_resistance_target_hill
        label: Upper Peripheral Resistance Target Hill Equation
        form: algebraic
        expression_latex: 'R_{aupf}(p_{cm}) = (R_{aupM} - R_{aupm}) \frac{p_{2Ru}^{k_R}}{p_{cm}^{k_R} + p_{2Ru}^{k_R}} + R_{aupm}'
        inputs: [pcm]
        parameters: [RaupM, Raupm, p2Ru, kR]
        outputs: [Raupf]
        description: "Sigmoidal Hill function relating carotid pressure to target upper peripheral resistance."
      - id: lower_peripheral_resistance_control
        label: Lower Peripheral Resistance Control
        form: differential
        expression_latex: '\frac{d R_{alp}(t)}{d t} = \frac{-R_{alp}(t) + R_{alpf}(p_{cm}(t))}{\tau_r}'
        inputs: [Ralp, pcm]
        parameters: [taur]
        outputs: [dRalp]
        description: "First order dynamics of autonomic lower body vasoconstriction."
      - id: lower_peripheral_resistance_target_hill
        label: Lower Peripheral Resistance Target Hill Equation
        form: algebraic
        expression_latex: 'R_{alpf}(p_{cm}) = (R_{alpM} - R_{alpm}) \frac{p_{2Ra}^{k_R}}{p_{cm}^{k_R} + p_{2Ra}^{k_R}} + R_{alpm}'
        inputs: [pcm]
        parameters: [RalpM, Ralpm, p2Ra, kR]
        outputs: [Ralpf]
        description: "Sigmoidal Hill function relating carotid pressure to target lower peripheral resistance."
      - id: end_diastolic_elastance_control
        label: End Diastolic Elastance Control
        form: differential
        expression_latex: '\frac{d E_d(t)}{d t} = \frac{-E_d(t) + E_{df}(p_{cm}(t))}{\tau_E}'
        inputs: [Ed, pcm]
        parameters: [tauE]
        outputs: [dEd]
        description: "First order dynamics of end diastolic elastance (parasympathetic cardiac modulation)."
      - id: end_diastolic_elastance_target_hill
        label: End Diastolic Elastance Target Hill Equation
        form: algebraic
        expression_latex: 'E_{df}(p_{cm}) = (E_{dM} - E_{dm}) \frac{p_{cm}^{k_E}}{p_{cm}^{k_E} + p_{2E}^{k_E}} + E_{dm}'
        inputs: [pcm]
        parameters: [EdM, Edm, p2E, kE]
        outputs: [Edf]
        description: "Sigmoidal Hill function relating carotid pressure to target end diastolic left ventricular elastance."
      - id: heart_rate_control
        label: Heart Rate Control
        form: differential
        expression_latex: '\frac{d H_c(t)}{d t} = \frac{-H_c(t) + H_f(p_{cm}(t))}{\tau_H}'
        inputs: [Hc, pcm]
        parameters: [tauH]
        outputs: [dHc]
        description: "First order dynamics of autonomic heart rate regulation."
      - id: heart_rate_target_hill
        label: Heart Rate Target Hill Equation
        form: algebraic
        expression_latex: 'H_f(p_{cm}) = (H_M - H_m) \frac{p_{2H}^{k_H}}{p_{cm}^{k_H} + p_{2H}^{k_H}} + H_m'
        inputs: [pcm]
        parameters: [HM, Hm, p2H, kH]
        outputs: [Hf]
        description: "Sigmoidal Hill function relating carotid pressure to target heart rate (in bps)."
      - id: upper_arterial_volume_derivative
        label: Upper Arterial Volume Derivative
        form: differential
        expression_latex: '\frac{d Vau(t)}{dt} = q_{av}(t) - q_{al}(t) - q_{aup}(t)'
        inputs: [qav, qal, qaup]
        outputs: [dVau]
        description: "Conservation of mass for upper body arterial blood compartment."
      - id: upper_venous_volume_derivative
        label: Upper Venous Volume Derivative
        form: differential
        expression_latex: '\frac{d Vvu(t)}{dt} = q_{vl}(t) + q_{aup}(t) - q_{mv}(t)'
        inputs: [qvl, qaup, qmv]
        outputs: [dVvu]
        description: "Conservation of mass for upper body venous blood compartment."
      - id: lower_arterial_volume_derivative
        label: Lower Arterial Volume Derivative
        form: differential
        expression_latex: '\frac{d Val(t)}{dt} = q_{al}(t) - q_{alp}(t)'
        inputs: [qal, qalp]
        outputs: [dVal]
        description: "Conservation of mass for lower body arterial blood compartment."
      - id: lower_venous_volume_derivative
        label: Lower Venous Volume Derivative
        form: differential
        expression_latex: '\frac{d Vvl(t)}{dt} = q_{alp}(t) - q_{vl}(t)'
        inputs: [qalp, qvl]
        outputs: [dVvl]
        description: "Conservation of mass for lower body venous blood compartment."
      - id: left_ventricular_volume_derivative
        label: Left Ventricular Volume Derivative
        form: differential
        expression_latex: '\frac{d Vlv(t)}{dt} = q_{mv}(t) - q_{av}(t)'
        inputs: [qmv, qav]
        outputs: [dVlv]
        description: "Conservation of mass for left ventricular chamber."
      - id: lower_venous_effective_capacity
        label: Effective Lower Venous Capacity (Cycle 2)
        form: algebraic
        expression_latex: 'V_{Mvl}^{eff}(t) = V_{Mvl} - V_{vm}(t) + V_{sr}(t)'
        inputs: [Vvm, Vsr]
        parameters: [VMvl]
        outputs: [VMvl_eff]
        description: "Lower venous capacity reduced by baroreflex venoconstriction and increased by stress-relaxation creep; the logarithmic P-V law operates on this effective capacity."
      - id: venomotor_reflex
        label: Venomotor Reflex (Cycle 2)
        form: differential
        expression_latex: '\frac{dV_{vm}}{dt} = \frac{-V_{vm} + \Delta V_{veno,max} \cdot \frac{p_{2V}^{k_V}}{p_{cm}^{k_V} + p_{2V}^{k_V}}}{\tau_{veno}}'
        inputs: [pcm]
        parameters: [dV_veno_max, p2V, kV, tau_veno]
        outputs: [dVvm]
        description: "Baroreflex-driven venoconstriction (Heldt 2002 structure, DOI 10.1152/japplphysiol.00241.2001); machine-proposed parameters (tier C)."
      - id: venous_stress_relaxation
        label: Venous Stress-Relaxation Creep (Cycle 2)
        form: differential
        expression_latex: '\frac{dV_{sr}}{dt} = \frac{-V_{sr} + G_{sr} \cdot \max(0, p_{vl} - p_{vl,sr0})}{\tau_{sr}}'
        inputs: [pvl]
        parameters: [G_sr, tau_sr, pvl_sr0]
        outputs: [dVsr]
        description: "Slow viscoelastic creep of lower venous capacity under sustained venous load (van Heusden 2006, DOI 10.1152/ajpheart.01268.2004); machine-proposed gain within documented 60-300 s time-constant range (tier C)."
    assumptions:
      - "Five-compartment lumped circulation: upper/lower arterial compartments, upper/lower venous compartments, and a single left ventricular chamber (Geddes 2022)."
      - "Baroreflex control operates on a first-order mean-carotid-pressure tracking state (tauP), not on instantaneous carotid pressure."
      - "The lower venous compartment follows a logarithmic pressure-volume law bounded by the effective capacity VMvl_eff = VMvl - Vvm + Vsr (cycle 2)."
      - "Cardiac dynamics are represented by a double-hill time-varying elastance function; beat-by-beat valve flow laws are implementation details, not part of this specification."
    limitations:
      - "Valve flow laws (qav, qmv) and atrial/pulmonary compartments are not captured in the equation registry; they live in the upstream implementations."
      - "Baroreceptor firing is modeled without myelinated/unmyelinated fiber distinction (see known_limitations on packages/cardiovascular/relationships.yaml)."
      - "Single-compartment lumped creep; does not reproduce biphasic fast/slow viscoelastic components."
    validity_domain:
      - population: ocpe:populations/healthy-control-cohort
        scope_note: "Base validation context (Geddes 2022, in silico). Model nominal parameters are adult-scale."
      - population: ocpe:populations/pots-clinical-cohort
        scope_note: "POTS phenotype contexts are expressed via the model_representations in packages/conditions.pots, not by changing this specification."
    source:
      references: [doi:10.1098/rsif.2022.0220, doi:10.48550/arXiv.2109.14558]
      upstream_implementation:
        repository: "https://github.com/msolufse/BaroreflexPOTSmodel.git"
        commit: "871f46f"
        language: MATLAB
        license: MIT
        citation_requirement: "Cite Geddes JR, Ottesen JT, Mehlsen J, Olufsen MS. J R Soc Interface 2022;19:20220220 (DOI 10.1098/rsif.2022.0220)."
    implementations:
      - name: "OCPE pre-0.1 Python simulation (Radau ODE solver, beat-by-beat)"
        repository: "invisible-illness-project/open-computational-physiology-engine @ pre-architectural-refactor (models/baroreflex_model.py, simulation/)"
        language: Python
        status: "migrated to MOSAIC (pending); preserved in migration_archive/"
        conformance_note: "Executes this specification's equation set including cycle-2 venous extension; solver settings and initialisation are MOSAIC configuration, not OCPE content."
    evidence:
      - supports: [existence, structure]
        references: [doi:10.1098/rsif.2022.0220]
        evidence_level: "Level 4"
      - supports: [structure]
        references: [doi:10.1152/japplphysiol.00241.2001, doi:10.1152/ajpheart.01268.2004]
        citation: "Cycle-2 venous extension: venomotor reflex structure per Heldt 2002; stress-relaxation creep per van Heusden 2006 (in-silico sources; machine-proposed parameters, tier C)."
        evidence_level: "Level 4"
    since: "1.0.0"
