ocpe: "0.1"
package: models.baroreflex-geddes-2022
title: Baroreflex model control-law relationships
description: >
  Mechanistic links realized by equations of the Geddes 2022 model, migrated
  from knowledge_base/ontology/mechanistic_links.yaml (v1.0). Each
  relationship's mathematical specification points at the equation(s) of this
  package's model entity. The legacy mathematical_ref file path
  (models/mathematical_models.yaml#<equation>) is repaired to a canonical
  model + equation pointer; equation ids are unchanged.
provenance:
  derived_from:
    - source: knowledge_base/ontology/mechanistic_links.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        relationships[] -> relationship entities; 'type' -> functional_form;
        mathematical_ref -> mathematical_specification {model, equations};
        evidence_score -> confidence (scale 'legacy 0-10').
  review_manifest: packages/models/baroreflex-geddes-2022/relationships.yaml.review.yaml
curation_notes:
  - "Legacy registry gap closed: the four 'type' values used here (sigmoid_hill, gravity_hydrostatic, inverse_proportional, inverse_nonlinear) were never registered in the pre-0.1 predicate/type registry; they are registered as functional forms in the core package (specification/core/functional-forms.yaml)."
  - "Legacy 'recreational_men_cohort'/'recreational_women_cohort' context references on RR_to_HR are free text (those cohorts were never registered in populations/cohorts.yaml)."
references:
  - id: doi:10.1098/rsif.2022.0220
    doi: 10.1098/rsif.2022.0220
    pmid: "36069002"
    title: "Postural orthostatic tachycardia syndrome explained using a baroreflex response model"
    citation: "Geddes JR, Ottesen JT, Mehlsen J, Olufsen MS. J R Soc Interface 2022;19:20220220."
    study_type: in_silico
    summary_document: evidence/references/geddes_2022_baroreflex_pots.md
  - id: doi:10.3390/s22176536
    doi: 10.3390/s22176536
    pmid: "36081005"
    title: "Validity of the Polar H10 Sensor for Heart Rate Variability Analysis during Rest, Exercise, and Recovery"
    citation: "Schaffarczyk et al., Sensors 2022;22(17):6536."
    study_type: device_validation
    summary_document: evidence/references/schaffarczyk_2022_polar_h10_validation.md
