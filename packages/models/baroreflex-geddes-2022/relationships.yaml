    label: Mean carotid pressure controls heart rate (Hill, first-order lag)
    subject: ocpe:cardiovascular/mean-carotid-pressure
    predicate: DECREASES
    object: ocpe:cardiovascular/heart-rate
    functional_form: sigmoid_hill
    direction_of_effect: negative
    confidence: {value: 9, scale: "legacy 0-10 (pre-0.1 mechanistic_links.yaml evidence_score)"}
    mathematical_specification:
      model: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022
      equations: [heart_rate_control, heart_rate_target_hill]
    evidence:
      - supports: [existence, structure, magnitude]
        references: [doi:10.1098/rsif.2022.0220]
        evidence_level: "Level 4"
        notes: "Migrated from mechanistic_links.yaml 'pcm_to_Hc' (sigmoid_hill). Heart rate is modeled in beats/s (symbol Hc)."
    applicable_contexts:
      - population: ocpe:populations/pots-clinical-cohort
