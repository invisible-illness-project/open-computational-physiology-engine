entities:
  - id: ocpe:interventions.tilt-test/head-up-tilt-test
    kind: intervention
    label: Head-Up Tilt (HUT) Test
    definition: "Orthostatic challenge diagnostic protocol."
    intervention_type: diagnostic_protocol
    aliases:
      - {value: head_up_tilt_test, type: legacy-id, scope: legacy-kb}
    purpose: "Assess autonomic cardiovascular regulation and diagnose orthostatic intolerance syndromes such as POTS."
    protocol:
      phases:
        - name: supine_rest
          duration: {value: 200.0, unit: s}
          description: "Baseline supine recording."
        - name: tilt_up
          duration: {value: 14.0, unit: s}
          description: "Smooth transition from supine to the tilt angle."
          settings:
            - name: tilt_angle
              value: 60.0
              unit: deg
        - name: sustained_tilt
          duration: {value: 100.0, unit: s}
          description: "Sustained head-up tilt at the specified angle and effective height."
          settings:
            - name: tilt_angle
              value: 60.0
              unit: deg
            - name: height
              value: 25.0
              unit: cm
        - name: tilt_down
          duration: {value: 14.0, unit: s}
          description: "Return to supine."
    evidence:
      - references: [doi:10.1098/rsif.2022.0220]
        notes: "Legacy intervention.provenance.doi; the protocol parameters match the Geddes 2022 simulation protocol."
