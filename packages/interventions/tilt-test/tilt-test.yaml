ocpe: "0.1"
package: interventions.tilt-test
title: Head-Up Tilt (HUT) Test
description: >
  Orthostatic challenge protocol: supine rest, 60-degree head-up tilt with a
  14-s transition, sustained tilt, and tilt-down. Phase timings and geometry
  are transcribed verbatim from the legacy source.
provenance:
  derived_from:
