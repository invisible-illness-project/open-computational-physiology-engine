  review_manifest: packages/interventions/tilt-test/tilt-test.yaml.review.yaml
references:
  - id: doi:10.1098/rsif.2022.0220
    doi: 10.1098/rsif.2022.0220
    pmid: "36069002"
    title: "Postural orthostatic tachycardia syndrome explained using a baroreflex response model"
    citation: "Geddes JR, Ottesen JT, Mehlsen J, Olufsen MS. J R Soc Interface 2022;19:20220220 (protocol provenance in the legacy source)."
    study_type: in_silico
