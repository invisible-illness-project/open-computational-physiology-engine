id: interventions.medication
name: Pharmacological Interventions (Medication Perturbations)
version: "1.1.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Pharmacological intervention specifications migrated from
  knowledge_base/diseases/medication.yaml (legacy v1.1, adversarial-DOI
  revision 2): beta-adrenergic blockade and fludrocortisone fluid expansion
  with evidence-tiered model representations for the Geddes 2022 baroreflex
  model. All scientific content (descriptions, mechanisms, citations,
  evidence levels/tiers, review statuses, and the file-header correction
  notes on fabricated and replacement DOIs) is preserved verbatim; nothing
  was re-graded during migration.
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate vocabulary
  - package: models.baroreflex-geddes-2022
    version: ">=1.0.0 <2.0.0"
    reason: intervention model representations reference model symbols
contents:
  - medication.yaml
provenance:
  derived_from:
    - source: knowledge_base/diseases/medication.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.1"
      transformation: >
        Legacy 'phenotypes' blocks are pharmacological interventions, not
        conditions: phenotype -> intervention entity (intervention_type:
        pharmacological); phenotype association_evidence -> entity evidence;
        parameters_perturbed -> model_representations.parameter_perturbations;
        unverified_parameters -> model_representations.unverified_parameter_perturbations
        (consumer-inert per legacy semantics); per-parameter provenance ->
        evidence with verbatim citations; review_status ->
        curation_status/curation_note; legacy application block
        (temporal_scope / schema_extension_required) folded into
        curation_note verbatim; file-header correction comments ->
        document curation_notes verbatim. No scientific content was
        re-graded during migration.
