entities:
  - id: ocpe:interventions.medication/beta-blocker
    kind: intervention
    label: Beta-Adrenergic Blockade
    aliases:
      - {value: beta_blocker, type: legacy-id, scope: legacy-kb}
    intervention_type: pharmacological
    definition: "Blunts chronotropic and inotropic sympathetic responses, limiting maximum heart rate."
    evidence:
      - supports: [association, direction]
        references: [doi:10.1172/JCI105282, pmid:5843708, doi:10.2165/00007256-198502060-00002]
        citation: "Epstein et al., J Clin Invest 1965;44:1745-53 (beta-blockade blunts maximal exercise HR — direction); Tesch, Sports Med 1985;2:389-412 (review)"
        evidence_tier: "B"
        notes: "Direction-level support ONLY: beta-blockade blunts maximal/exercise heart rate. Contains no 132 bpm cap and no baroreflex gain values. evidence_tier 'B' rationale (verbatim source comment): human data, direction only."
    model_representations:
      - model: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022
        parameter_perturbations: []
        unverified_parameter_perturbations:
          - parameter: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022#HM
            baseline_value: 3.3333
            perturbed_value: 2.2
            unit: /s
            mechanism: "Competitive antagonism of beta-1 adrenergic receptors caps maximum heart rate (hypothesized ceiling ~132 bpm; direction supported by phenotype-level association_evidence, magnitude is a machine-proposed assumption)."
            evidence:
              - supports: [magnitude]
                basis: machine_proposed
                evidence_level: "Level 4"
                evidence_tier: "D"
                notes: "MACHINE-PROPOSED hypotheses. REQUIRE HUMAN REVIEW before promotion to parameters_perturbed. Deliberately NO parameter-level DOI (the phenotype-level citations support direction, not these magnitudes)."
            curation_status: unverified
            curation_note: "UNRESOLVED - magnitude 2.2 bps (~132 bpm) has no accessible quantitative source; requires human review"
          - parameter: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022#kH
            baseline_value: 25.0
            perturbed_value: 12.0
            unit: "1"
            mechanism: "Intended: blunted sympathetic HR responsiveness under beta-blockade. CAVEAT: this conflates receptor blockade (blunted maximal/sympathetic limb) with baroreflex loop gain; no accessible source shows baroreflex HR-control gain halves under beta-blockade. Consider modeling beta-blockade via HM (and possibly p2H) only."
            evidence:
              - supports: [magnitude]
                basis: machine_proposed
                evidence_level: "Level 4"
                evidence_tier: "D"
                notes: "MACHINE-PROPOSED hypotheses. REQUIRE HUMAN REVIEW before promotion to parameters_perturbed. Deliberately NO parameter-level DOI (the phenotype-level citations support direction, not these magnitudes)."
            curation_status: unverified
            curation_note: "UNRESOLVED - gain reduction 25->12 has no supporting source found; parameter mapping questioned; requires human review"
    since: "1.1.0"
  - id: ocpe:interventions.medication/fludrocortisone
    kind: intervention
    label: Fludrocortisone Fluid Expansion
    aliases:
      - {value: fludrocortisone, type: legacy-id, scope: legacy-kb}
    intervention_type: pharmacological
    definition: "Mineralocorticoid receptor agonist that increases blood volume and sodium retention."
    model_representations:
      - model: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022
        parameter_perturbations:
          - parameter: ocpe:models.baroreflex-geddes-2022/baroreflex-geddes-2022#TotalVol
            baseline_value: 4500.0
            perturbed_value: 5000.0
            unit: mL
            mechanism: "ACUTE/EARLY-PHASE intravascular volume expansion via renal sodium retention and osmotic fluid shift (Chobanian 1979: initial plasma-volume expansion with sodium retention). NOT valid as a chronic steady-state perturbation — with long-term treatment plasma volume returns to control levels and the pressor effect is TPR-mediated (Chobanian 1979)."
            evidence:
              - supports: [direction]
                references: [doi:10.1056/NEJM197907123010202, pmid:449947]
                citation: "Chobanian et al., N Engl J Med 1979;301:68-73 (7 orthostatic-hypotension patients; transient volume expansion, chronic TPR-mediated hypertension, enhanced norepinephrine pressor responsiveness). Supports acute-phase direction AND time course; the +500 ml magnitude itself remains an assumption."
                evidence_level: "Level 2"
                evidence_tier: "B"
                notes: "direction/time-course from human data; +500 ml magnitude is an assumption (noted in review_status)"
            curation_status: partially_verified
            curation_note: "NEEDS REVIEW - +500 ml magnitude unverified; chronic-phase representation blocked on schema extension. application (legacy): temporal_scope=acute_to_early_chronic_only; schema_extension_required=time-varying/phase-dependent perturbations (acute volume expansion -> chronic TPR-mediated pressor effect)"
    since: "1.1.0"
