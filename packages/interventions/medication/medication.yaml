ocpe: "0.1"
package: interventions.medication
title: Pharmacological medication interventions
description: >
  Pharmacological modifications to cardiovascular and fluid homeostatic
  parameters (verbatim legacy disease description, medication.yaml v1.1):
  beta-adrenergic blockade and fludrocortisone fluid expansion. Model
  representations are model-specific hypotheses (with their own evidence)
  about how each intervention is encoded in the Geddes 2022 baroreflex
  model; clinical/physiological claims are carried by the intervention
  entities and their association evidence.
provenance:
  derived_from:
    - source: knowledge_base/diseases/medication.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.1"
      transformation: >
        medication.yaml v1.1 (adversarial-DOI revision 2) migrated without
        re-grading; file-header correction rationale (fabricated-DOI review
        and replacement citations) and the fludrocortisone x-schema
        time-varying-effects note preserved verbatim in curation_notes.
  review_manifest: packages/interventions/medication/medication.yaml.review.yaml
curation_notes:
  - "SOURCE HEADER (verbatim, medication.yaml v1.1): PROPOSED CORRECTION (not yet merged) — adversarial DOI review. Revision 2 (independent-review WARNING 2): beta_blocker tier-D magnitudes (HM 2.2 bps, kH 12) moved OUT of canonical parameters_perturbed into unverified_parameters; direction-level citations (Epstein 1965, Tesch 1985) moved to a phenotype-level association_evidence block so no unverified magnitude carries a parameter-level DOI implying source support. PerturbationManager (simulation/perturbations.py:39,71) reads ONLY parameters_perturbed, so the engine safely ignores these blocks. fludrocortisone.TotalVol REMAINS in parameters_perturbed because its acute-phase direction AND time course are source-supported (Chobanian 1979, tier B); only the +500 ml magnitude is an assumption, and the entry is explicitly scoped to the acute/early phase."
  - "SOURCE HEADER (verbatim, fabricated-DOI review): BOTH old DOIs are FABRICATED (nonexistent): * 10.1161/01.CIR.94.11.2824 — doi.org 404; PubMed enumeration of the entire Circulation 94(11) Dec-1996 issue shows NO article beginning on p. 2824 (sequence runs 2817-25 then 2826-30). Nearest real article: Gilbert et al. 1996 (metoprolol vs carvedilol in CHF, DOI 10.1161/01.CIR.94.11.2817, PMID 8941107) — its abstract contains no HR cap or gain values. * 10.1161/01.HYP.30.5.1102 — doi.org 404; Hypertension 30(5) Nov-1997 has no article at p. 1102 and no fludrocortisone study in the issue."
  - "SOURCE HEADER (verbatim, replacement citations): Replacement citations (verified via Europe PMC; abstracts accessed where noted): * Beta-blockade direction: Epstein SE et al., J Clin Invest 1965;44:1745-53 (DOI 10.1172/JCI105282, PMID 5843708 — classic primary study; full text is a page scan, numbers not machine-accessible) and Tesch PA, Sports Med 1985;2:389-412 (DOI 10.2165/00007256-198502060-00002, PMID 2866577 — review). Neither yields the specific 132 bpm cap from accessible text. * Fludrocortisone: Chobanian AV et al., N Engl J Med 1979;301:68-73 (DOI 10.1056/NEJM197907123010202, PMID 449947 — abstract accessed): 7 patients with orthostatic hypotension; INITIAL sodium retention + plasma-volume expansion, but \"with long-term treatment, plasma volume decreased to control levels despite further blood-pressure increases\"; chronic hypertension was TPR-mediated, \"not volume dependent\". => The old static +500 ml chronic volume perturbation is CONTRADICTED for the chronic phase."
  - "SOURCE COMMENT (verbatim, fludrocortisone x-schema note): SCHEMA LIMITATION / EXTENSION REQUIRED: the perturbation schema cannot express TIME-VARYING (phase-dependent) drug effects. Per Chobanian 1979, fludrocortisone's volume expansion is TRANSIENT (early treatment) while the CHRONIC pressor effect is mediated by increased total peripheral resistance (and enhanced pressor responsiveness to norepinephrine), with plasma volume returning to control levels. The static TotalVol perturbation below therefore represents ONLY the acute/early phase. CHRONIC PHASE (not encodable in current schema — flagged for schema extension): TotalVol should return toward 4500 ml; the chronic effect should instead be represented as a resistance/pressor-sensitivity increase (no quantitative parameter mapping proposed here — requires human review)."
