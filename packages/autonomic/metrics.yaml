ocpe: "0.1"
package: autonomic
title: Autonomic derived metrics
description: >
  Quantities defined by an algorithm applied to RR interval series. Window
  choices and artifact handling are part of the metric definition. RMSSD and
  DFA alpha-1 were referenced by the pre-0.1 relationship layer but only
  DFA_a1 was registered (as a variable); this package registers both with
  their correct kind (derived_metric), closing the known registry gap.
provenance:
  derived_from:
    - source: knowledge_base/physiology/variables.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        'DFA_a1' reclassified variable -> derived_metric; computation
        description carried verbatim.
    - source: knowledge_base/ontology/relationships.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "3.2"
      transformation: >
        'RMSSD' (previously unregistered) registered as a derived_metric
        derived from the rr-interval variable.
references:
  - id: doi:10.3390/s22176536
    doi: 10.3390/s22176536
    pmid: "36081005"
    title: "Validity of the Polar H10 Sensor for Heart Rate Variability Analysis during Rest, Exercise, and Recovery"
    citation: "Schaffarczyk et al., Sensors 2022;22(17):6536."
    study_type: device_validation
    summary_document: evidence/references/schaffarczyk_2022_polar_h10_validation.md
entities:
  - id: ocpe:autonomic/rmssd
    kind: derived_metric
    label: RMSSD
    definition: "Root mean square of successive differences between adjacent RR intervals; a time-domain heart rate variability metric reflecting short-term vagally mediated variation."
    derived_from: [ocpe:cardiovascular/rr-interval]
    computation:
      method: "Root mean square of successive differences (time-domain HRV)"
      formula: "RMSSD = sqrt( mean( (RR_{i+1} - RR_i)^2 ) )"
      input_requirements: "RR interval series; requires high sampling precision; sensitive to ectopic beats and motion artifacts."
      references: [doi:10.3390/s22176536]
    dimension: time
    canonical_unit: ms
    aliases:
      - {value: RMSSD, type: symbol, scope: legacy-kb, unit: ms}
    since: "1.0.0"
  - id: ocpe:autonomic/dfa-alpha-1
    kind: derived_metric
    label: Detrended Fluctuation Analysis alpha 1
    definition: "Short-term scaling exponent alpha1 of detrended fluctuation analysis, representing autonomic balance and cardiovascular fatigue"
    derived_from: [ocpe:cardiovascular/rr-interval]
    computation:
      method: "Detrended fluctuation analysis (DFA), short-term scaling exponent over the approximately 4-16 beat window"
      input_requirements: "RR interval series; sensitive to nonstationarity, ectopic beats and motion artifacts."
      references: [doi:10.3390/s22176536]
    dimension: dimensionless
    canonical_unit: "1"
    aliases:
      - {value: DFA_a1, type: symbol, scope: legacy-kb}
    reference_ranges:
      - range_type: plausibility_bound
        min: 0.0
        max: 2.0
        unit: "1"
        context: {scope_note: "Legacy valid_range from the pre-0.1 knowledge base (DFA_a1, 0-2); engineering plausibility bound, not a population reference interval."}
    since: "1.0.0"
