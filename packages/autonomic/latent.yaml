ocpe: "0.1"
package: autonomic
title: Autonomic latent constructs
description: >
  Theoretical autonomic quantities that cannot be observed even in principle;
  values are always model- or indicator-conditional estimates and must never be
  exchanged as if they were measurements. Ranges are normalized latent-state
  scales from the pre-0.1 knowledge base (engineering conventions, not
  population reference intervals).
provenance:
  derived_from:
    - source: knowledge_base/physiology/latent_states.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        latent_variables[] (category 'autonomic') -> latent_construct
        entities; valid_range -> scale min/max; symbols preserved as
        legacy-kb aliases.
  review_manifest: packages/autonomic/latent.yaml.review.yaml
entities:
  - id: ocpe:autonomic/sympathetic-tone
    kind: latent_construct
    label: Sympathetic Tone
    definition: "The level of activity of the sympathetic division of the autonomic nervous system, regulating vasoconstriction and heart rate acceleration."
    dimension: dimensionless
    canonical_unit: "1"
    scale: {scale_type: normalized, min: 0, max: 1, interpretation: "Normalized latent-state scale from the pre-0.1 knowledge base (legacy valid_range 0-1)."}
    aliases:
      - {value: T_sym, type: symbol, scope: legacy-kb}
    since: "1.0.0"
  - id: ocpe:autonomic/parasympathetic-tone
    kind: latent_construct
    label: Parasympathetic Tone
    definition: "The level of activity of the parasympathetic division of the autonomic nervous system, primarily regulating cardiac deceleration (vagal tone) and ventricular compliance."
    dimension: dimensionless
    canonical_unit: "1"
    scale: {scale_type: normalized, min: 0, max: 1, interpretation: "Normalized latent-state scale from the pre-0.1 knowledge base (legacy valid_range 0-1)."}
    aliases:
      - {value: T_para, type: symbol, scope: legacy-kb}
    since: "1.0.0"
  - id: ocpe:autonomic/baroreflex-gain
    kind: latent_construct
    label: Baroreflex Gain
    definition: "The sensitivity of the baroreflex feedback loops in responding to changes in blood pressure."
    dimension: dimensionless
    canonical_unit: "1"
    scale: {scale_type: index, min: 0, max: 100, interpretation: "Index scale from the pre-0.1 knowledge base (legacy valid_range 0-100)."}
    aliases:
      - {value: G_baro, type: symbol, scope: legacy-kb}
    since: "1.0.0"
  - id: ocpe:autonomic/circadian-drive
    kind: latent_construct
    label: Circadian Drive
    definition: "The endogenous circadian pacemaker signal modulating autonomic function and body temperature."
    dimension: dimensionless
    canonical_unit: "1"
    scale: {scale_type: normalized, min: -1, max: 1, interpretation: "Signed normalized drive from the pre-0.1 knowledge base (legacy valid_range -1 to 1)."}
    aliases:
      - {value: D_circ, type: symbol, scope: legacy-kb}
    since: "1.0.0"
  - id: ocpe:autonomic/sleep-pressure
    kind: latent_construct
    label: Sleep Pressure
    definition: "The homeostatic sleep drive that accumulates during wakefulness and dissipates during sleep, influencing parasympathetic dominance."
    dimension: dimensionless
    canonical_unit: "1"
    scale: {scale_type: normalized, min: 0, max: 1, interpretation: "Normalized latent-state scale from the pre-0.1 knowledge base (legacy valid_range 0-1)."}
    aliases:
      - {value: P_sleep, type: symbol, scope: legacy-kb}
    since: "1.0.0"
  - id: ocpe:autonomic/stress-load
    kind: latent_construct
    label: Stress Load
    definition: "Allostatic load representing the psychological or physical stressors that elevate sympathetic tone."
    dimension: dimensionless
    canonical_unit: "1"
    scale: {scale_type: normalized, min: 0, max: 1, interpretation: "Normalized latent-state scale from the pre-0.1 knowledge base (legacy valid_range 0-1)."}
    aliases:
      - {value: L_stress, type: symbol, scope: legacy-kb}
    since: "1.0.0"
