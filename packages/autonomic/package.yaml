id: autonomic
name: Autonomic Physiology
version: "1.0.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Autonomic nervous system content: latent constructs (sympathetic/parasympathetic
  tone, baroreflex gain, circadian drive, sleep pressure, stress load), derived
  HRV metrics (RMSSD, DFA alpha-1) and their relationships. Migrated from the
  pre-0.1 knowledge base (knowledge_base/physiology/latent_states.yaml,
  knowledge_base/ontology/relationships.yaml).
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate and functional-form vocabulary
  - package: cardiovascular
    version: ">=1.0.0 <2.0.0"
    reason: RR interval and heart rate are defined there
  - package: populations
    version: ">=1.0.0 <2.0.0"
    reason: relationship applicable-context population descriptors
contents:
  - latent.yaml
  - metrics.yaml
  - relationships.yaml
provenance:
  derived_from:
    - source: knowledge_base/physiology/latent_states.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        latent_variables[] that are not observable even in principle ->
        latent_construct entities with normalized scale. (Latent-state items
        measurable in principle were reclassified as cardiovascular variables;
        systemic ones moved to the systemic package.)
    - source: knowledge_base/physiology/variables.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        'DFA_a1' reclassified from variable to derived_metric (algorithm-
        defined quantity). RMSSD registered here as a derived metric, closing
        the known pre-0.1 registry gap (it was referenced by
        relationships.yaml but never registered).
    - source: knowledge_base/ontology/relationships.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "3.2"
      transformation: >
        semantic_relationships with autonomic subjects -> relationship
        entities (cycle-3 corrections preserved).
