id: wearables
name: Wearable Measurement Methods
version: "1.0.0"
ocpe_spec: ">=0.1.0 <0.2.0"
status: provisional
license: UNSPECIFIED
description: >
  Measurement method (sensor) specifications with context-qualified accuracy
  performance. Signal synthesis and processing pipelines are out of scope for
  OCPE (they belong to downstream signal tooling, e.g. Lamina). Migrated from
  knowledge_base/wearables/.
dependencies:
  - package: core
    version: ">=0.1.0 <0.2.0"
    reason: predicate vocabulary
  - package: cardiovascular
    version: ">=1.0.0 <2.0.0"
    reason: measured targets (RR interval, heart rate) are defined there
contents:
  - polar-h10.yaml
  - photoplethysmography.yaml
provenance:
  derived_from:
    - source: knowledge_base/wearables/polar_h10.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: "sensor spec -> measurement_method entity; validation entries -> context-qualified performance metrics."
    - source: knowledge_base/wearables/photoplethysmography.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: "sensor spec -> measurement_method entity; validation entries -> context-qualified performance metrics. NOTE: the legacy source recorded no provenance (DOI) for its validation figures; none is asserted here."
