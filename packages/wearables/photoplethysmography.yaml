ocpe: "0.1"
package: wearables
title: Wearable optical photoplethysmography (PPG)
description: >
  Optical PPG sensing as implemented in consumer wearables. Performance
  figures are agreement statistics against ECG in specific activity contexts.
  NOTE: the legacy source recorded no provenance (citation) for these figures;
  none is asserted here, and they SHOULD be re-sourced before downstream use.
provenance:
  derived_from:
    - source: knowledge_base/wearables/photoplethysmography.yaml
      git_ref: pre-architectural-refactor
      legacy_version: "1.0"
      transformation: >
        sensor block -> measurement_method entity. The legacy validation
        entries carried no citation; they are preserved as unreferenced
        performance metrics with an explicit re-sourcing caveat.
  review_manifest: packages/wearables/photoplethysmography.yaml.review.yaml
entities:
  - id: ocpe:wearables/optical-ppg
    kind: measurement_method
    label: Wearable Optical Photoplethysmography (PPG)
    definition: "Optical PPG sensing (green/red/infrared wavelengths) as implemented in wrist- or finger-based consumer wearables."
    method_type: device
    modality: optical_ppg
    aliases:
      - {value: photoplethysmography, type: legacy-id, scope: legacy-kb}
    measures:
      - target: ocpe:cardiovascular/heart-rate
        mode: derived
      - target: ocpe:cardiovascular/rr-interval
        mode: derived
        note: "Pulse rate variability (PRV) as an RR-interval proxy; agreement with true RR intervals is context-dependent."
    specifications:
      - name: sampling_frequency
        value: 50.0
        unit: Hz
      - name: wavelengths
        value: "green, red, infrared"
    performance:
      - target: ocpe:cardiovascular/heart-rate
        reference_method: Standard ECG
        metrics:
          - {metric: icc, value: 0.92}
          - {metric: pearson_r, value: 0.91}
          - {metric: bias, value: 0.5, unit: /min}
        context:
          activity: rest
        notes: "PROVENANCE GAP: preserved verbatim from the legacy source, which recorded no citation for these figures. Re-source before use."
      - target: ocpe:cardiovascular/rr-interval
        reference_method: Standard ECG
        metrics:
          - {metric: icc, value: 0.85}
          - {metric: pearson_r, value: 0.84}
          - {metric: bias, value: 2.1, unit: ms}
        context:
          activity: low_intensity
          scope_note: "Legacy 'parameters_evaluated: [RR]' (pulse rate variability); exercise_intensity 'low_intensity'."
        notes: "PROVENANCE GAP: preserved verbatim from the legacy source, which recorded no citation for these figures. Re-source before use."
    failure_modes:
      - "Vasoconstriction due to cold ambient temperatures leading to low perfusion index"
      - "Slick/sweaty skin causing optical sensor slippage"
      - "Ambient light leakage causing saturated signal photodetectors"
    artifact_handling: "Adaptive filtering using tri-axial accelerometer data"
    since: "1.0.0"
