[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ocpe"
version = "0.1.0"
description = "Open Computational Physiology Engine: reference implementation of the OCPE physiological specification and semantic interoperability engine"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
# Symlinks to the canonical files at the repository root (single source of
# truth); hatchling embeds them in the wheel/sdist as dist-info/licenses/.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Invisible Illness Project" }]
copyright = "Copyright 2026 The Invisible Illness Project"
keywords = ["physiology", "ontology", "interoperability", "specification", "json-schema", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ocpe = "ocpe.cli:main"

[project.urls]
Repository = "https://github.com/invisible-illness-project/open-computational-physiology-engine"

[tool.hatch.build.targets.wheel]
packages = ["src/ocpe"]

# Bundle the language-independent specification into built distributions so an
# installed engine is self-contained. In a source checkout the engine reads
# ../../specification; hatch_build.py copies it into src/ocpe/_spec at build time.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/ocpe", "README.md", "pyproject.toml", "tests", "hatch_build.py", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]