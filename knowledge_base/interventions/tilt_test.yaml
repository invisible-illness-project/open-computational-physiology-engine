version: "1.0"
intervention:
  id: "head_up_tilt_test"
  name: "Head-Up Tilt (HUT) Test"
  type: "orthostatic_challenge"
  protocol:
    supine_rest_seconds: 200.0
    tilt_transition_seconds: 14.0
    tilt_duration_seconds: 100.0
    tilt_angle_degrees: 60.0
    height_cm: 25.0
    tilt_down_seconds: 14.0
  purpose: "Assess autonomic cardiovascular regulation and diagnose orthostatic intolerance syndromes such as POTS."
  # --- Evidence governance (G-P0-08/G-P0-10, metadata only; protocol values unchanged) ---
  canonical_status: "canonical"     # protocol mirrors the Geddes 2022 in-silico protocol
  evidence_tier: "C"                # in-silico protocol definition
  evidence_e_level: "E0-E1"
  source_claim_ids: null            # FLAG: no EVIDENCE_REGISTRY claim for the in-silico protocol
  provenance:
    doi: "10.1098/rsif.2022.0220"
    evidence_level: "Level 4"
