version: "1.1"
sensor:
  id: "polar_h10"
  name: "Polar H10 Heart Rate Sensor (research chest strap class)"
  type: "dry_electrode_ecg"
  manufacturer: "Polar Electro"
  # --- Evidence governance (G-P0-08/G-P0-10, metadata only; specs unchanged) ---
  canonical_status: "canonical"     # human validation data vs 12-lead ECG (Schaffarczyk 2022)
  evidence_tier: "B"                # human device-validation data, semi-quantitative (ICC/LoA)
  evidence_e_level: "E2-E3"
  source_claim_ids: ["EVD-SENS-002"]  # registry source lists Schaffarczyk 2022 (DOI verbatim match 10.3390/s22176536)
  specifications:
    sampling_frequency: 130.0 # internal ECG sampling frequency in Hz
    rr_resolution_ms: 1.0
    communication: "Bluetooth Low Energy / ANT+"
  ecg:
    sampling_frequency_hz:
      value: 130.0
      units: Hz
      distribution: point (+/-2% tolerance)
      evidence_tier: E3
      source:
        dossier: "SENSOR_MODEL_EVIDENCE.md section 1.3 (device spec + independent commentary)"
      canonical_status: canonical
      uncertainty: "130 Hz +/-2%, 24-bit"
      provisional: false
    passband_hz:
      value: [0.7, 40.0]
      units: Hz
      distribution: band-limit
      evidence_tier: E3
      source:
        dossier: "SENSOR_MODEL_EVIDENCE.md section 1.3"
      canonical_status: canonical
      uncertainty: "0.7 Hz high-pass distorts ST; adequate for RR/IBI only"
      provisional: false
    qrs_amplitude_mv:
      value: 1.0
      range: [0.5, 2.0]
      units: mV
      distribution: uniform within range
      evidence_tier: E1
      source:
        dossier: "SENSOR_MODEL_EVIDENCE.md section 1.1 (surface single-lead QRS 0.5-2 mV)"
      canonical_status: canonical
      uncertainty: "subject/electrode dependent"
      provisional: false
    adc_full_scale_mv:
      value: 5.0
      units: mV
      distribution: point
      evidence_tier: E3
      source:
        dossier: "SENSOR_MODEL_EVIDENCE.md section 1 (front-end range; exact FSR not in dossier)"
      canonical_status: experimental
      uncertainty: "front-end full-scale range is a modelling choice"
      provisional: true
  rr_measurement:
    bias_ms_rest:
      value: 0.7
      range: [0.4, 0.7]
      units: ms
      distribution: bias, intensity-dependent (0.7 ms rest -> 0.4 ms high intensity)
      evidence_tier: E3
      source:
        claim_id: EVD-SENS-002
        doi: "10.3390/s22176536"
        dossier: "SENSOR_MODEL_EVIDENCE.md section 1.5 (Schaffarczyk 2022)"
      canonical_status: canonical
      uncertainty: "n=25, healthy, rest + exhaustive cycling ramp"
      provisional: false
    bias_ms_exercise:
      value: 0.4
      range: [0.4, 0.7]
      units: ms
      distribution: bias at high intensity
      evidence_tier: E3
      source:
        claim_id: EVD-SENS-002
        doi: "10.3390/s22176536"
        dossier: "SENSOR_MODEL_EVIDENCE.md section 1.5"
      canonical_status: canonical
      uncertainty: "bias shrinks with intensity; LoA narrows"
      provisional: false
    loa_rest_ms:
      value: [-2.8, 4.3]
      units: ms
      distribution: Bland-Altman limits of agreement; noise sigma derived as width/3.92
      evidence_tier: E3
      source:
        claim_id: EVD-SENS-002
        doi: "10.3390/s22176536"
        dossier: "SENSOR_MODEL_EVIDENCE.md section 1.5"
      canonical_status: canonical
      uncertainty: "low-intensity LoA +4.3/-2.8 ms"
      provisional: false
    loa_exercise_ms:
      value: [-0.5, 1.3]
      units: ms
      distribution: Bland-Altman limits of agreement at high intensity
      evidence_tier: E3
      source:
        claim_id: EVD-SENS-002
        doi: "10.3390/s22176536"
        dossier: "SENSOR_MODEL_EVIDENCE.md section 1.5"
      canonical_status: canonical
      uncertainty: "high-intensity LoA +1.3/-0.5 ms"
      provisional: false
    patient_cohort_hr_mape_percent:
      value: 4.9
      units: percent
      distribution: MAPE after bespoke artifact removal (arrhythmic/older cohorts)
      evidence_tier: E3
      source:
        claim_id: EVD-SENS-002
        dossier: "SENSOR_MODEL_EVIDENCE.md section 1.5 (Vermunicht 2025 negative finding)"
      canonical_status: canonical
      uncertainty: "~5x healthy-cohort error; Europace abstract"
      provisional: false
  communication:
    protocol: "Bluetooth Low Energy / ANT+"
    loss_model: "artifact_models.dropout (streaming vs on_device regime)"
  validation:
    - parameters_evaluated: ["RR", "HR"]
      icc: 0.99
      pearson_r: 0.99
      bias: 0.7 # ms (rest, Schaffarczyk 2022)
      loa_lower: -2.8
      loa_upper: 4.3
      exercise_intensity: "rest"
      reference_device: "Standard 12-lead ECG"
      provenance:
        doi: "10.3390/s22176536"
        claim_id: EVD-SENS-002
    - parameters_evaluated: ["RR", "HR"]
      icc: 0.96
      pearson_r: 0.96
      bias: 0.4 # ms (high intensity, Schaffarczyk 2022)
      loa_lower: -0.5
      loa_upper: 1.3
      exercise_intensity: "high_intensity"
      reference_device: "Standard 12-lead ECG"
      provenance:
        doi: "10.3390/s22176536"
        claim_id: EVD-SENS-002
    - parameters_evaluated: ["RR signal quality"]
      signal_quality_percent: 99.4
      exercise_intensity: "high_intensity"
      reference_device: "Holter (89.8%)"
      provenance:
        doi: "10.1007/s00421-019-04142-4"
        claim_id: EVD-SENS-002
  failure_modes:
    - "Dry electrodes leading to high contact resistance and signal dropouts (exercise onset)"
    - "Motion artifacts during high-intensity upper body movements"
    - "Incomplete contact with skin during rapid body rotation"
    - "Implausible HR spikes (>200 bpm) on contact loss (doi:10.1186/s12938-025-01353-0)"
  motion_artifact_handling: "Reject beats with >15% deviation from rolling mean RR interval"
